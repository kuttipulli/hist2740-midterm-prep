997): “new immigrants” from southern and eastern Europe (about 1895–1924) held an “inbetween” racial status, neither fully white nor non-white.<\/li><li>Native-born Americans racialized them with slurs and doubted their fitness, yet the law classed them as white for naturalization.<\/li><li>Workplaces and unions sorted jobs into “white man's work” and the rest; immigrants learned American race through work, housing and politics.<\/li><li>“Americanization from the bottom up”: becoming American included learning to distance oneself from Black and Asian workers.<\/li><li>Significance: whiteness was a process, not a given; this complicates simple assimilation stories. Contrast Guglielmo's “white on arrival.”<\/li><\/ul>","rubric":["Defined the term precisely","Placed it in time and named key people or institutions","Tied it to a specific reading and its author's argument","Explained its significance (what it changed, who gained or lost)","Connected it to at least one other keyword"]},{"id":"ID-whiteon","mod":"newimm","kind":"self","diff":2,"tag":"twin","stem":"<b>Identify:<\/b> “white on arrival”<div class='hint'>On paper, in your own words: define · context · reading · significance · connection.<\/div>","model":"<span class='muted small'>Chicago, 1890–1945 · Guglielmo, <i>White on Arrival<\/i><\/span><ul><li>Guglielmo: Italians in Chicago (1890–1945) were treated as white from the moment they arrived.<\/li><li>Key distinction: “color” (white, Black, and so on) vs. “race” (Italian, Nordic, Mediterranean). Italians were seen as an inferior race but were securely white by color.<\/li><li>Evidence: courts, naturalization, the census, unions and housing markets classed them as white, which gave them advantages over African Americans.<\/li><li>Ascription (lecture): identity assigned by others. Italians were white less because of how they saw themselves than because of how others treated them.<\/li><li>Over time, Italians embraced white identity, sometimes violently defending the color line.<\/li><li>Significance: argues against “how X became white” and “inbetween” accounts.<\/li><\/ul>","rubric":["Defined the term precisely","Placed it in time and named key people or institutions","Tied it to a specific reading and its author's argument","Explained its significance (what it changed, who gained or lost)","Connected it to at least one other keyword"]},{"id":"ID-eugenics","mod":"newimm","kind":"self","diff":2,"tag":"twin","stem":"<b>Identify:<\/b> eugenics<div class='hint'>On paper, in your own words: define · context · reading · significance · connection.<\/div>","model":"<span class='muted small'>1900s–1920s · Immigration and eugenics reading (Grant, 1916); Ross; Ngai; lecture<\/span><ul><li>Definition: a pseudo-scientific movement to “improve” a population's heredity by controlling who reproduces and who may enter.<\/li><li>U.S. leaders: Madison Grant (<i>The Passing of the Great Race<\/i>, 1916, Nordic superiority), E. A. Ross (inferior “stock” from southern and eastern Europe), Harry Laughlin (expert for Congress).<\/li><li>Lecture: Progressive-era scientific racism treated the nation as an organism that needed protection from “impurities.”<\/li><li>Fed restriction: the literacy test (1917) and national-origins quotas (1924); editorial cartoons pictured immigrants as disease and threat.<\/li><li>Admired abroad: the lecture notes that Hitler cited the 1924 Act as a model.<\/li><li>Significance: gave racism a scientific veneer and turned it into law.<\/li><\/ul>","rubric":["Defined the term precisely","Placed it in time and named key people or institutions","Tied it to a specific reading and its author's argument","Explained its significance (what it changed, who gained or lost)","Connected it to at least one other keyword"]},{"id":"ID-hundred","mod":"quotas","kind":"self","diff":2,"tag":"twin","stem":"<b>Identify:<\/b> “100% Americanism”<div class='hint'>On paper, in your own words: define · context · reading · significance · connection.<\/div>","model":"<span class='muted small'>About 1915–1920s · Lecture (Oct 6); Barrett & Roediger<\/span><ul><li>Definition: a WWI-era demand (from about 1915) for total, undivided loyalty and cultural conformity from immigrants and ethnic Americans.<\/li><li>Context: U.S. entry into WWI (1917); fear of German Americans and radicals; the Espionage Act (1917) and Sedition Act (1918); a wartime surveillance apparatus (lecture).<\/li><li>Tools: coercive Americanization, suppression of the German language and press, loyalty campaigns, and deportation of radicals in the Red Scare (1919–20, the Palmer Raids).<\/li><li>Linked to attacks on “hyphenates” (Theodore Roosevelt).<\/li><li>Taken up in the 1920s by the American Legion and the revived Ku Klux Klan.<\/li><li>Fed the 1917 literacy test and the quota laws of 1921 and 1924.<\/li><\/ul>","rubric":["Defined the term precisely","Placed it in time and named key people or institutions","Tied it to a specific reading and its author's argument","Explained its significance (what it changed, who gained or lost)","Connected it to at least one other keyword"]},{"id":"ID-hyphen","mod":"quotas","kind":"self","diff":2,"tag":"twin","stem":"<b>Identify:<\/b> “hyphenates”<div class='hint'>On paper, in your own words: define · context · reading · significance · connection.<\/div>","model":"<span class='muted small'>1910s (roots in the 1850s) · Lecture (Oct 6); Zolberg<\/span><ul><li>Definition: a derisive label (1910s) for immigrants and ethnic Americans with a dual identity (German-American, Irish-American), accused of divided loyalty.<\/li><li>Theodore Roosevelt (1915): “no room in this country for hyphenated Americanism”; Woodrow Wilson warned that a man carrying a hyphen carries a dagger.<\/li><li>Context: WWI neutrality debates; immigrant newspapers took sides (Irish against Britain, many Germans for Germany).<\/li><li>Roots: 1850s nativists like Samuel Morse already attacked “Irish fellow-citizens” and other hyphenated identities (Zolberg).<\/li><li>Led to 100% Americanism, loyalty surveillance and pressure to give up ethnic institutions.<\/li><li>Significance: loyalty tests aimed at ethnic identity.<\/li><\/ul>","rubric":["Defined the term precisely","Placed it in time and named key people or institutions","Tied it to a specific reading and its author's argument","Explained its significance (what it changed, who gained or lost)","Connected it to at least one other keyword"]},{"id":"ID-literacy","mod":"quotas","kind":"self","diff":2,"tag":"twin","stem":"<b>Identify:<\/b> Literacy Test (1917 Act)<div class='hint'>On paper, in your own words: define · context · reading · significance · connection.<\/div>","model":"<span class='muted small'>February 1917 · Lecture (Oct 6); Zolberg; Gabaccia<\/span><ul><li>The Immigration Act of 1917, passed over President Wilson's veto (earlier versions were vetoed by Cleveland, Taft and Wilson).<\/li><li>Required immigrants over 16 to read a short passage in some language; aimed at southern and eastern Europeans, whom restrictionists saw as less literate and less “fit.”<\/li><li>Pushed by the Immigration Restriction League and Henry Cabot Lodge, backed by eugenic arguments and the Dillingham Commission (1911).<\/li><li>Also created the Asiatic Barred Zone, excluding most of Asia, and widened grounds for deportation (lecture).<\/li><li>It didn't cut numbers enough for restrictionists, which led to the quotas of 1921 and 1924.<\/li><\/ul>","rubric":["Defined the term precisely","Placed it in time and named key people or institutions","Tied it to a specific reading and its author's argument","Explained its significance (what it changed, who gained or lost)","Connected it to at least one other keyword"]},{"id":"ID-johnson","mod":"quotas","kind":"self","diff":2,"tag":"twin","stem":"<b>Identify:<\/b> Johnson-Reed Act (1924)<div class='hint'>On paper, in your own words: define · context · reading · significance · connection.<\/div>","model":"<span class='muted small'>May 1924; in force to 1965 · Ngai, “The Architecture of Race”; lecture<\/span><ul><li>The Immigration Act of 1924 (Rep. Albert Johnson, Sen. David Reed), also called the National Origins Act.<\/li><li>Quotas: 2% of each nationality's foreign-born population in the 1890 census, chosen to cut southern and eastern Europeans; from 1929, quotas by the “national origins” of the 1920 population, about 150,000 a year in all.<\/li><li>Barred “aliens ineligible for citizenship,” ending Japanese immigration.<\/li><li>No quotas for the Western Hemisphere (employers wanted Mexican labor), but consular visas and the new Border Patrol (1924) produced the “illegal alien” (Ngai).<\/li><li>Ngai: the law built a hierarchy of European nationalities inside one white race, while excluding or not counting non-whites.<\/li><li>In force until the 1965 Hart-Celler Act; the lecture notes Hitler cited it approvingly.<\/li><\/ul>","rubric":["Defined the term precisely","Placed it in time and named key people or institutions","Tied it to a specific reading and its author's argument","Explained its significance (what it changed, who gained or lost)","Connected it to at least one other keyword"]},{"id":"ID-ineligible","mod":"quotas","kind":"self","diff":2,"tag":"twin","stem":"<b>Identify:<\/b> “aliens ineligible for citizenship”<div class='hint'>On paper, in your own words: define · context · reading · significance · connection.<\/div>","model":"<span class='muted small'>Ozawa 1922; Thind 1923; 1924 Act · Ngai; lecture (Oct 6); course handout<\/span><ul><li>Course definition: a euphemistic legal concept used to exclude Asian immigrants from U.S. citizenship.<\/li><li>Because naturalization was limited to “white persons” (1790) and people of African descent (1870), Asians could not naturalize: Ozawa (1922) ruled Japanese were not white; Thind (1923) ruled Asian Indians were not white in the common understanding.<\/li><li>The 1924 Act barred “aliens ineligible to citizenship,” excluding all Asians without naming them and ending the Gentlemen's Agreement with Japan (1907–08).<\/li><li>Also used in California's Alien Land Laws (1913, 1920) to bar Asians from owning land.<\/li><li>Ngai: it made Asian Americans permanent foreigners, whatever their place of birth.<\/li><li>Ended in steps: Chinese exclusion repealed in 1943; the McCarran-Walter Act (1952) ended racial bars on naturalization.<\/li><\/ul>","rubric":["Defined the term precisely","Placed it in time and named key people or institutions","Tied it to a specific reading and its author's argument","Explained its significance (what it changed, who gained or lost)","Connected it to at least one other keyword"]},{"id":"ID-quota","mod":"quotas","kind":"self","diff":2,"tag":"twin","stem":"<b>Identify:<\/b> national origins quota system<div class='hint'>On paper, in your own words: define · context · reading · significance · connection.<\/div>","model":"<span class='muted small'>1921–1965 · Ngai; lecture (Oct 6, Oct 13)<\/span><ul><li>Definition: the system (1921–1965) that allocated immigration visas by nationality to preserve the nation's supposed ethnic makeup.<\/li><li>1921 Emergency Quota Act: 3% of each nationality in the 1910 census. 1924: 2% of the 1890 census, then from 1929 quotas based on the “national origins” of the 1920 white population.<\/li><li>Favored northwestern Europe (Britain, Germany, Ireland); slashed Italians, Poles, Jews and Greeks; Asians barred.<\/li><li>Ngai: the calculations were arbitrary and racialized; descendants of enslaved Africans and Native Americans were left out of the base population.<\/li><li>Lecture: quotas had a ceiling but no floor and no refugee provision, so Jewish refugees were blocked in the 1930s (the St. Louis, 1939).<\/li><li>Abolished by the 1965 Hart-Celler Act.<\/li><\/ul>","rubric":["Defined the term precisely","Placed it in time and named key people or institutions","Tied it to a specific reading and its author's argument","Explained its significance (what it changed, who gained or lost)","Connected it to at least one other keyword"]},{"id":"ID-model","mod":"quotas","kind":"self","diff":2,"tag":"twin","stem":"<b>Identify:<\/b> model minority<div class='hint'>On paper, in your own words: define · context · reading · significance · connection.<\/div>","model":"<span class='muted small'>Coined 1966; roots in postwar resettlement · Course handout; Taylor; lecture<\/span><ul><li>Course definition: a label for immigrant groups seen as hardworking, educated, law-abiding, upwardly mobile and politically quiet; applied mostly to Asian Americans.<\/li><li>Popularized in 1966 (William Petersen, “Success Story, Japanese-American Style,” <i>New York Times Magazine<\/i>).<\/li><li>Roots: after WWII incarceration, resettling Japanese Americans (Taylor) were pushed to disperse, assimilate and prove their loyalty.<\/li><li>Used against other groups, especially Black Americans during the civil rights era, to suggest that racism does not hold people back.<\/li><li>Critique: hides discrimination and the differences among Asian Americans, and makes acceptance conditional, like contributionism.<\/li><li>Contrast: a few decades earlier, the same groups were called “unassimilable.”<\/li><\/ul>","rubric":["Defined the term precisely","Placed it in time and named key people or institutions","Tied it to a specific reading and its author's argument","Explained its significance (what it changed, who gained or lost)","Connected it to at least one other keyword"]},{"id":"MC01","mod":"frames","kind":"mc","stem":"Who argued that Americans stopped calling newcomers “emigrants” and began calling them “immigrants” around the Civil War, as the idea of a “nation of immigrants” took shape?","choices":["Donna Gabaccia","Kunal Parker","Aristide Zolberg","Elizabeth Ellis"],"ans":0,"sol":"Gabaccia, “Nations of Immigrants: Do Words Matter?” traces the shift from emigrant to immigrant and the 20th-century rise of the phrase.","diff":1,"tag":""},{"id":"MC02","mod":"frames","kind":"mc","stem":"Defending immigrants by listing what they give the nation (labor, culture, inventions, soldiers) is called:","choices":["remote control","ethnonationalism","contributionism","Americanization"],"ans":2,"sol":"Contributionism. JFK's <i>A Nation of Immigrants<\/i> is the classic example; its weakness is that belonging depends on usefulness.","diff":1,"tag":""},{"id":"MC03","mod":"frames","kind":"mc","stem":"What is the point of the slogan “the border crossed us”?","choices":["Mexican Americans and Native peoples became “foreign” because U.S. borders moved over their land through conquest","The Border Patrol was created to protect Native land","Most migrants crossed without papers","Immigrants should cross only at official ports"],"ans":0,"sol":"After 1848 (and through settler colonialism), the border moved over people who never moved. Ellis extends this to Native nations.","diff":2,"tag":""},{"id":"MC04","mod":"frames","kind":"mc","stem":"Which idea of the nation fits the 1924 national-origins quotas best?","choices":["Paine's “asylum for mankind”","Ethnonationalism: the nation as a people of shared descent to preserve","Civic nationalism based on shared political principles","Contributionism"],"ans":1,"sol":"The quotas tried to freeze the nation's ethnic makeup: an ethnonational idea (Ngai).","diff":1,"tag":""},{"id":"MC05","mod":"frames","kind":"mc","stem":"In immigration law, appeals to “sovereignty” usually justify:","choices":["immigrants' right to choose a nationality","treaty limits on U.S. power","the nation's inherent, near-absolute power to admit, exclude and expel foreigners","each state's right to set naturalization rules"],"ans":2,"sol":"Chae Chan Ping (1889) grounded the power to exclude in sovereignty, the basis of plenary power.","diff":1,"tag":""},{"id":"MC06","mod":"frames","kind":"mc","stem":"Ellis's main criticism of the “nation of immigrants” story is that it:","choices":["hides Native dispossession and settler colonialism","exaggerates how many immigrants came","overstates European radicalism","ignores the Passenger Acts"],"ans":0,"sol":"Native nations were not immigrants; U.S. borders and sovereignty were imposed on them.","diff":2,"tag":""},{"id":"MC07","mod":"early","kind":"mc","stem":"The Naturalization Act of 1790 opened naturalization to:","choices":["Protestant men who owned property","any immigrant after five years","“free white persons” after two years' residence","anyone born in Europe"],"ans":2,"sol":"“Free white person,” two years' residence, good character. Residency later rose to 5 (1795) and 14 (1798) years, then returned to 5 (1802).","diff":1,"tag":""},{"id":"MC08","mod":"early","kind":"mc","stem":"“Prepare in time an asylum for mankind” comes from:","choices":["the Alien Friends Act (1798)","Thomas Paine, <i>Common Sense<\/i> (1776)","John F. Kennedy, <i>A Nation of Immigrants<\/i>","Emma Lazarus, “The New Colossus”"],"ans":1,"sol":"Paine, January 1776. Lazarus's Statue of Liberty poem (1883) is a different text.","diff":1,"tag":"","trap":"Lazarus's “huddled masses” is the Statue of Liberty poem, not Paine."},{"id":"MC09","mod":"early","kind":"mc","stem":"A child is born in Chicago to Italian citizens who live there. Under which principle is the child a U.S. citizen?","choices":["jus soli","jus sanguinis","naturalization","plenary power"],"ans":0,"sol":"Birth on U.S. soil: jus soli, constitutional since the Fourteenth Amendment (1868).","diff":2,"tag":""},{"id":"MC10","mod":"early","kind":"mc","stem":"The Passenger Act of 1803 discussed by Zolberg was passed by:","choices":["the U.S. Congress, to attract Europeans","the Continental Congress","the British Parliament, to slow the emigration of workers","New York's legislature"],"ans":2,"sol":"1803 is British. The first U.S. Passenger Act came in 1819.","diff":1,"tag":"","trap":"It's easy to assume every Passenger Act was American."},{"id":"MC11","mod":"early","kind":"mc","stem":"What did the U.S. Passenger Act of 1819 do?","choices":["Limited passengers per ship tonnage and required passenger lists for customs","Banned Chinese laborers","Set a literacy test","Created Ellis Island"],"ans":0,"sol":"It regulated crowding and created the first federal count of arrivals; Zolberg calls it early “remote control.”","diff":1,"tag":""},{"id":"MC12","mod":"early","kind":"mc","stem":"Zolberg's “remote control” means:","choices":["deporting people by executive order","monitoring immigrants after arrival","states controlling their own borders","controlling migration before migrants reach U.S. soil (ship rules, consuls, visas)"],"ans":3,"sol":"From the 1819 Passenger Act to the consular visas of the 1924 Act, the U.S. decided who could come before they arrived.","diff":2,"tag":""},{"id":"MC13","mod":"early","kind":"mc","stem":"Neuman's “lost century” (1776–1875) refers to:","choices":["the years before the Constitution","a century when states and localities actively regulated migration, which later histories forgot","a century with almost no immigration","a century of completely open borders"],"ans":1,"sol":"States regulated paupers, convicts, disease and free Black people. The myth of open borders before 1875 is wrong.","diff":1,"tag":""},{"id":"MC14","mod":"early","kind":"mc","stem":"Which fear drove most state immigration laws before the Civil War?","choices":["fear of crossings from Mexico","pauperism: that poor immigrants would depend on local relief","fear of Asian labor","fear of communism"],"ans":1,"sol":"Bonds, head taxes and removals targeted paupers (Zolberg, Neuman, Parker).","diff":1,"tag":""},{"id":"MC15","mod":"ante","kind":"mc","stem":"Mayor of New York v. Miln (1837) held that New York's passenger-reporting law was:","choices":["a valid use of the state's police power","unconstitutional under the commerce clause","a violation of the Burlingame Treaty","a power reserved to the federal government"],"ans":0,"sol":"The Court upheld it as police power and compared paupers to a “moral pestilence.”","diff":2,"tag":"","trap":"Miln upheld state power; Chy Lung (1876) went the other way."},{"id":"MC16","mod":"ante","kind":"mc","stem":"Gibbons v. Ogden (1824) matters for immigration because it:","choices":["upheld state taxes on immigrants","created the first Passenger Act","read “commerce” broadly to include navigation, so passenger ships could fall under federal power","denied citizenship to Black Americans"],"ans":2,"sol":"A commerce case (steamboats) that became the precedent for federal power over passenger ships.","diff":1,"tag":""},{"id":"MC17","mod":"ante","kind":"mc","stem":"Why did Southern states resist federal control over entry before the Civil War?","choices":["A strong federal power over who enters could be turned against their control of free Black people and slavery","They had no immigrants","They wanted more European immigrants","They objected to the commerce clause on religious grounds"],"ans":0,"sol":"Parker and Kenny: slavery kept immigration power with the states until after the Civil War.","diff":1,"tag":""},{"id":"MC18","mod":"ante","kind":"mc","stem":"Parker's “Blacks, Indians, and Other Aliens” argues that in antebellum America:","choices":["immigrants were treated better than in Europe","citizenship was the same for everyone","the federal government controlled all migration","free Black people, Native Americans and others were treated as foreigners inside the nation"],"ans":3,"sol":"Domestic foreignness: entry bans on free Black people, Dred Scott, Removal of Native nations.","diff":2,"tag":""},{"id":"MC19","mod":"ante","kind":"mc","stem":"The Know-Nothings demanded:","choices":["free land for immigrants","open immigration from Asia","an end to slavery","a 21-year wait for naturalization and office for native-born men only"],"ans":3,"sol":"Anti-Catholic nativism of the 1850s (Whitney; “America for the Americans”).","diff":1,"tag":""},{"id":"MC20","mod":"ante","kind":"mc","stem":"Which text defended immigrants against Know-Nothing nativism?","choices":["Samuel Morse's attack on hyphenated citizens","Bishop Martin Spalding's pastoral letter (1855)","the “America for the Americans” editorial (1855)","Thomas Whitney's <i>Defence of the American Policy<\/i> (1856)"],"ans":1,"sol":"Spalding, writing after Louisville's “Bloody Monday,” defended immigrant rights; the others are nativist.","diff":1,"tag":""},{"id":"MC21","mod":"labor","kind":"mc","stem":"“Coolie” was:","choices":["the name of a labor union","a neutral term for any immigrant worker","a racializing label for Asian laborers bound by oppressive contracts","a treaty term for Chinese merchants"],"ans":2,"sol":"Republicans called coolieism a new slavery (1862 ban); the label was stretched to all Chinese workers (Kenny).","diff":2,"tag":""},{"id":"MC22","mod":"labor","kind":"mc","stem":"The Burlingame Treaty (1868):","choices":["recognized free voluntary migration between the U.S. and China but withheld naturalization","banned contract labor","excluded Chinese laborers","made Chinese immigrants citizens"],"ans":0,"sol":"Migration yes, naturalization no; renegotiated in 1880 to allow suspending Chinese labor migration.","diff":1,"tag":""},{"id":"MC23","mod":"labor","kind":"mc","stem":"The Foran Act (1885):","choices":["barred Chinese women","banned importing workers under labor contracts made before arrival","created national-origins quotas","set a literacy test"],"ans":1,"sol":"The Alien Contract Labor Law, backed by the Knights of Labor.","diff":1,"tag":"","trap":"Don't confuse it with the Page Act (1875) or the Exclusion Act (1882)."},{"id":"MC24","mod":"labor","kind":"mc","stem":"Erickson argues that the 1864 contract labor law was mainly meant to bring:","choices":["southern Italian farmworkers","refugees from revolution","unskilled Chinese railroad workers","skilled industrial workers, mostly from Britain"],"ans":3,"sol":"Erickson: linking contract labor to unskilled Asian and southern European workers was “not based on fact.”","diff":2,"tag":""},{"id":"MC25","mod":"labor","kind":"mc","stem":"Kenny traces the origins of federal immigration policy to:","choices":["World War I","the gold rush alone","the Know-Nothing party","antislavery politics: efforts to end coolie labor and other forms of unfree labor"],"ans":3,"sol":"“The Antislavery Origins of U.S. Immigration Policy” (2021).","diff":1,"tag":""},{"id":"MC26","mod":"labor","kind":"mc","stem":"Birthright citizenship was written into the Constitution in order to overturn:","choices":["Miln (1837)","Dred Scott v. Sandford (1857)","Chae Chan Ping (1889)","the Page Act (1875)"],"ans":1,"sol":"The Fourteenth Amendment (1868) reversed Dred Scott.","diff":1,"tag":""},{"id":"MC27","mod":"excl","kind":"mc","stem":"The Page Act (1875) barred:","choices":["workers with prior labor contracts","people who could not read","Asian laborers brought without their consent, women brought for prostitution, and convicts","all Chinese laborers for ten years"],"ans":2,"sol":"It was enforced mainly against Chinese women.","diff":2,"tag":"","trap":"Page (1875) ≠ Exclusion (1882) ≠ Foran (1885)."},{"id":"MC28","mod":"excl","kind":"mc","stem":"Chy Lung v. Freeman struck down California's law because:","choices":["states may never tax ships","admitting foreigners is a federal power, and one state's actions could drag the nation into diplomatic conflict","Chinese women were citizens","it violated a naturalization clause"],"ans":1,"sol":"22 Chinese women detained in 1874; a turning point in federalization.","diff":1,"tag":""},{"id":"MC29","mod":"excl","kind":"mc","stem":"The Chinese Exclusion Act (1882):","choices":["set national-origins quotas","excluded all Chinese, including merchants","suspended Chinese laborers' immigration for 10 years and barred Chinese naturalization","was the first federal law restricting any immigrants"],"ans":2,"sol":"Merchants, students, teachers, diplomats and travelers were exempt.","diff":1,"tag":"","trap":"The Page Act (1875) came first."},{"id":"MC30","mod":"excl","kind":"mc","stem":"In Chae Chan Ping (1889), the Supreme Court ruled that:","choices":["a reentry certificate guaranteed his return","the power to exclude foreigners is part of national sovereignty, and Congress may override a treaty","Chinese laborers could naturalize","states control immigration"],"ans":1,"sol":"The origin of plenary power; the Scott Act (1888) voided his certificate.","diff":2,"tag":""},{"id":"MC31","mod":"excl","kind":"mc","stem":"The plenary power doctrine means:","choices":["the president cannot deport anyone","courts largely defer to Congress and the executive on immigration","immigrants have full constitutional rights at the border","states have full power over immigration"],"ans":1,"sol":"Grounded in sovereignty (Chae Chan Ping, Nishimura Ekiu, Fong Yue Ting).","diff":1,"tag":""},{"id":"MC32","mod":"excl","kind":"mc","stem":"United States v. Wong Kim Ark (1898) held that:","choices":["citizenship follows the father's nationality","Chinese immigrants may naturalize","the Exclusion Act was unconstitutional","a child born in the U.S. to Chinese parents is a citizen by birth"],"ans":3,"sol":"Citizenship by birth under the Fourteenth Amendment; naturalization stayed barred.","diff":1,"tag":""},{"id":"MC33","mod":"excl","kind":"mc","stem":"In the 1930s, U.S. consuls used which clause to deny visas to Jewish refugees?","choices":["the literacy test","“likely to become a public charge” (LPC)","“aliens ineligible for citizenship”","the Foran Act"],"ans":1,"sol":"LPC, applied abroad: remote control in practice.","diff":2,"tag":""},{"id":"MC34","mod":"excl","kind":"mc","stem":"Lew-Williams argues that the anti-Chinese violence of 1885–86 (Tacoma, Seattle, Rock Springs):","choices":["ended Chinese exclusion","was mainly about religion","had nothing to do with federal law","pushed Congress toward stricter exclusion and helped make the Chinese “the alien”"],"ans":3,"sol":"Violence and exclusion worked together (<i>The Chinese Must Go<\/i>).","diff":1,"tag":""},{"id":"MC35","mod":"newimm","kind":"mc","stem":"Barrett & Roediger's “inbetween peoples” are:","choices":["southern and eastern European new immigrants who were neither securely white nor non-white","Chinese merchants","Mexican Americans after 1848","children of mixed marriages"],"ans":0,"sol":"They learned American race “from the bottom up” as part of becoming American.","diff":1,"tag":""},{"id":"MC36","mod":"newimm","kind":"mc","stem":"Guglielmo's “white on arrival” argues that Italians in Chicago were:","choices":["barred from naturalization","classified as Asian","treated as white by color from arrival, even while seen as an inferior race","considered non-white until 1945"],"ans":2,"sol":"The color vs. race distinction.","diff":2,"tag":"","trap":"“Inbetween” is Barrett &amp; Roediger; “white on arrival” is Guglielmo, and they disagree."},{"id":"MC37","mod":"newimm","kind":"mc","stem":"Hull-House's Labor Museum aimed to:","choices":["teach eugenics","train strikebreakers","deport paupers","ease tension between immigrant parents and their Americanized children by honoring old-world crafts"],"ans":3,"sol":"Addams, “Immigrants and Their Children” (<i>Twenty Years at Hull-House<\/i>, 1910).","diff":1,"tag":""},{"id":"MC38","mod":"newimm","kind":"mc","stem":"Who popularized the term “melting pot” with a 1908 play?","choices":["Israel Zangwill","E. A. Ross","Madison Grant","Jane Addams"],"ans":0,"sol":"Zangwill, <i>The Melting Pot<\/i> (1908).","diff":1,"tag":""},{"id":"MC39","mod":"newimm","kind":"mc","stem":"Which pair is matched correctly?","choices":["Jane Addams: led the Know-Nothings","A. Piatt Andrews: demanded a 21-year naturalization wait","E. A. Ross: restrictionist, eugenic fears about “inferior” new immigrants","Madison Grant: defended Italian immigrants"],"ans":2,"sol":"Ross (restriction) vs. Andrews (assimilation optimism) in <i>Opposing Viewpoints<\/i>.","diff":2,"tag":""},{"id":"MC40","mod":"newimm","kind":"mc","stem":"Eugenics shaped immigration law most directly through:","choices":["Gibbons v. Ogden","the Passenger Act of 1819","the 1790 Naturalization Act","the 1917 literacy test and the 1924 national-origins quotas"],"ans":3,"sol":"Grant, Ross and Laughlin supplied the “science” for restriction.","diff":1,"tag":""},{"id":"MC41","mod":"newimm","kind":"mc","stem":"Americanization campaigns in the 1910s mainly tried to:","choices":["send immigrants home","teach immigrants their native languages","change immigrants' language, habits and loyalties to match Anglo-Protestant norms","set quotas"],"ans":2,"sol":"Schools, settlement houses and employers' English classes; coercive in WWI.","diff":1,"tag":""},{"id":"MC42","mod":"quotas","kind":"mc","stem":"Theodore Roosevelt's “no room for hyphenated Americanism” (1915) attacked:","choices":["dual ethnic identities seen as divided loyalty","contract labor","Chinese merchants","the melting pot"],"ans":0,"sol":"WWI loyalty politics; it led to 100% Americanism.","diff":2,"tag":""},{"id":"MC43","mod":"quotas","kind":"mc","stem":"Besides the literacy test, the 1917 Immigration Act created:","choices":["national-origins quotas","the Border Patrol","Ellis Island","the Asiatic Barred Zone"],"ans":3,"sol":"The Border Patrol came in 1924; quotas in 1921 and 1924; Ellis Island opened in 1892.","diff":1,"tag":""},{"id":"MC44","mod":"quotas","kind":"mc","stem":"The Johnson-Reed Act (1924):","choices":["set quotas at 3% of the 1910 census","repealed Chinese exclusion","set quotas at 2% of each nationality in the 1890 census and barred aliens ineligible for citizenship","ended all immigration from Mexico"],"ans":2,"sol":"Using 1890 cut southern and eastern Europeans.","diff":1,"tag":"","trap":"3% of 1910 is the 1921 Emergency Quota Act."},{"id":"MC45","mod":"quotas","kind":"mc","stem":"“Aliens ineligible for citizenship” was a euphemism mainly for:","choices":["southern Italians","Mexican workers","Irish Catholics","Asian immigrants, after Ozawa (1922) and Thind (1923)"],"ans":3,"sol":"Race-based bars on naturalization made all Asians “ineligible.”","diff":2,"tag":""},{"id":"MC46","mod":"quotas","kind":"mc","stem":"Ngai's “architecture of race” argument is that the 1924 Act:","choices":["was mainly about literacy","treated all immigrants equally","ranked European nationalities within one white race, excluded Asians, and produced the “illegal alien” for Mexicans","was written to help refugees"],"ans":2,"sol":"Ngai, <i>Journal of American History<\/i> (1999).","diff":1,"tag":""},{"id":"MC47","mod":"quotas","kind":"mc","stem":"What did “100% Americanism” demand during and after WWI?","choices":["open borders for wartime allies","total, undivided loyalty and cultural conformity","100% literacy","full civil rights for immigrants"],"ans":1,"sol":"Linked to hyphen-hunting, the Red Scare and the 1920s Klan.","diff":1,"tag":""},{"id":"MC48","mod":"quotas","kind":"mc","stem":"The term “model minority” became prominent:","choices":["in the 1960s, applied mostly to Asian Americans","in Paine's <i>Common Sense<\/i>","in the 1924 quota law","in the 1850s, applied to Irish Catholics"],"ans":0,"sol":"William Petersen, 1966; roots in postwar Japanese American resettlement.","diff":2,"tag":""},{"id":"MC49","mod":"quotas","kind":"mc","stem":"Why were Western Hemisphere countries left out of the 1924 quotas?","choices":["The Burlingame Treaty","The Fourteenth Amendment forbade it","They had no emigrants","Employers, especially in agriculture, wanted Mexican labor"],"ans":3,"sol":"No quotas, but visas and the Border Patrol (1924) created “illegal” status (Ngai).","diff":1,"tag":""},{"id":"PR1","mod":"excl","kind":"pair","stem":"Which case moved power over immigration toward the federal government? Pick the case <b>and<\/b> the reason.","choices":["Chy Lung v. Freeman (1876)","Mayor of New York v. Miln (1837)"],"reasons":["States may protect themselves from paupers under the police power","The Burlingame Treaty made Chinese immigrants citizens","Admitting foreigners touches foreign relations, which belong to the nation as a whole"],"ans":[0,2],"sol":"Chy Lung: one state's abuses could drag the whole nation into diplomatic conflict. Miln went the other way, upholding state police power.","diff":2,"tag":""},{"id":"PR2","mod":"labor","kind":"pair","stem":"Did the Fourteenth Amendment end racial limits on naturalization? Pick the answer <b>and<\/b> the reason.","choices":["Yes","No"],"reasons":["Wong Kim Ark opened naturalization to Asians","Its citizenship clause covers birth; naturalization stayed limited by statute to white persons and people of African descent","It declared every resident a citizen"],"ans":[1,1],"sol":"Birthright (Wong Kim Ark, 1898) is not naturalization; Asians stayed “ineligible” until 1943–1952.","diff":2,"tag":""},{"id":"PR3","mod":"newimm","kind":"pair","stem":"How does Guglielmo differ from Barrett &amp; Roediger on new European immigrants? Pick the claim <b>and<\/b> the reason.","choices":["Italians were white on arrival","Italians were “inbetween” until WWII"],"reasons":["He separates color (white) from race (Italian), and institutions classed Italians as white by color","Italians identified as Black","Naturalization law denied Italians whiteness"],"ans":[0,0],"sol":"Guglielmo: securely white by color, while seen as an inferior “race.” Barrett & Roediger: whiteness was a process.","diff":2,"tag":""},{"id":"PR4","mod":"quotas","kind":"pair","stem":"Which law most fully realized Zolberg's “remote control”? Pick the law <b>and<\/b> the reason.","choices":["The Johnson-Reed Act (1924)","The Naturalization Act (1790)"],"reasons":["It set residency rules for naturalization","It required visas from U.S. consuls abroad, so admission was decided before departure","It created the Asiatic Barred Zone"],"ans":[0,1],"sol":"Consular visas moved the decision overseas (lecture, Oct 6).","diff":2,"tag":""},{"id":"PR5","mod":"early","kind":"pair","stem":"Was the antebellum United States a land of open borders? Pick the answer <b>and<\/b> the reason.","choices":["Yes","No"],"reasons":["Ellis Island screened arrivals from 1820","Congress passed sweeping restriction in 1819","States and localities regulated paupers, convicts, disease and free Black people (Neuman's “lost century”)"],"ans":[1,2],"sol":"Neuman: regulation was mostly state-level, so later histories overlooked it.","diff":2,"tag":""},{"id":"ES1","mod":"essay","kind":"self","diff":3,"tag":"","stem":"<b>Essay practice.<\/b> How did U.S. immigration and naturalization law use race to decide who could belong to the nation between 1790 and 1924? How did that change over time?<div class='hint'>Spend 5 minutes on an outline: thesis + three sections + keywords + authors. Write it out if you have 25 minutes.<\/div>","model":"<p><b>Thesis option:<\/b> Law didn't just reflect race; it made racial categories durable. Whiteness was a condition of membership from 1790, Asians became permanent foreigners, and by 1924 Europeans were ranked inside a single white race.<\/p><ol><li><b>Founding terms:<\/b> Naturalization Act 1790 (“free white persons”); jus soli vs. jus sanguinis; Parker's domestic foreignness (free Black people, Native nations); Dred Scott.<\/li><li><b>Reconstruction opens and closes:<\/b> Fourteenth Amendment and birthright citizenship; 1870 naturalization for people of African descent only; “coolie” and Kenny's antislavery origins; Page Act 1875; Chinese Exclusion 1882; Wong Kim Ark 1898 (birth vs. naturalization).<\/li><li><b>Ranking Europeans, barring Asians:<\/b> “inbetween peoples” vs. “white on arrival”; eugenics; Literacy Test 1917; Johnson-Reed 1924 and “aliens ineligible for citizenship” (Ngai's architecture of race).<\/li><\/ol><p><b>Complication:<\/b> Guglielmo vs. Barrett &amp; Roediger on whether Europeans were ever outside whiteness. <b>So what:<\/b> the “nation of immigrants” welcomed a racially defined “us.”<\/p>","rubric":["A clear, arguable thesis that answers the question","At least five keywords used accurately, with dates","At least three readings cited by author","Change over time (what changed, what stayed, why)","A counterpoint or complication","A conclusion that answers “so what?”"]},{"id":"ES2","mod":"essay","kind":"self","diff":3,"tag":"","stem":"<b>Essay practice.<\/b> Who controlled America's borders before 1900: the states or the nation? Explain how and why authority shifted, and what “sovereignty” came to mean.<div class='hint'>Spend 5 minutes on an outline: thesis + three sections + keywords + authors. Write it out if you have 25 minutes.<\/div>","model":"<p><b>Thesis option:<\/b> States controlled most migration for a century through the police power, largely because slavery made the South guard its control over Black mobility. After the Civil War, federal courts and Congress nationalized the power and grounded it in an almost unlimited sovereignty.<\/p><ol><li><b>The lost century (Neuman):<\/b> pauperism, bonds and head taxes; police power; Miln 1837; Passenger Acts and the commerce clause (Gibbons 1824); remote control (Zolberg).<\/li><li><b>Slavery and domestic foreignness (Parker, Kenny):<\/b> state control over free Black people; why the South resisted federal power.<\/li><li><b>Federalization:<\/b> Chy Lung and Henderson (1876); Page Act; 1882 Acts; Chae Chan Ping 1889 → sovereignty and plenary power; 1891 bureaucracy.<\/li><\/ol><p><b>Complication:<\/b> Ellis: whose sovereignty? The border itself rests on dispossession. <b>So what:<\/b> plenary power still shields immigration law from constitutional limits.<\/p>","rubric":["A clear, arguable thesis that answers the question","At least five keywords used accurately, with dates","At least three readings cited by author","Change over time (what changed, what stayed, why)","A counterpoint or complication","A conclusion that answers “so what?”"]},{"id":"ES3","mod":"essay","kind":"self","diff":3,"tag":"","stem":"<b>Essay practice.<\/b> Explain how U.S. immigration policy has worked as labor policy from the 1860s to the 1920s.<div class='hint'>Spend 5 minutes on an outline: thesis + three sections + keywords + authors. Write it out if you have 25 minutes.<\/div>","model":"<p><b>Thesis option:<\/b> Policy swung between recruiting workers and shutting them out, depending on who controlled labor markets. Fears of “unfree” labor justified excluding Asians first, then restricting Europeans.<\/p><ol><li><b>Recruitment:<\/b> 1864 contract labor law (Erickson: skilled British workers); Burlingame 1868 and railroad labor.<\/li><li><b>“Unfree” labor as a reason to exclude:<\/b> “coolie” and the 1862 ban; Kenny's antislavery origins; Page Act; Chinese Exclusion 1882; the white workers' movement (Lew-Williams).<\/li><li><b>Restricting Europeans:<\/b> Foran Act 1885 (Knights of Labor); LPC; Literacy Test 1917; 1924 quotas with the Western Hemisphere exempt for Mexican farm labor.<\/li><\/ol><p><b>Complication:<\/b> employers vs. white workers; race shaped which workers counted as “free.” <b>So what:<\/b> labor needs explain exceptions such as Mexico in 1924.<\/p>","rubric":["A clear, arguable thesis that answers the question","At least five keywords used accurately, with dates","At least three readings cited by author","Change over time (what changed, what stayed, why)","A counterpoint or complication","A conclusion that answers “so what?”"]},{"id":"ES4","mod":"essay","kind":"self","diff":3,"tag":"","stem":"<b>Essay practice.<\/b> Is the United States a “nation of immigrants”? Evaluate the phrase using the history of welcome and exclusion to 1924.<div class='hint'>Spend 5 minutes on an outline: thesis + three sections + keywords + authors. Write it out if you have 25 minutes.<\/div>","model":"<p><b>Thesis option:<\/b> The phrase captures a real tradition of welcome (Paine, contributionism) but hides conquest, slavery and exclusion. American openness was always selective by race, class and politics.<\/p><ol><li><b>Welcome:<\/b> “asylum for all mankind” (Paine 1776); the 1790 Act's easy naturalization for whites; JFK's contributionism (Gabaccia on the phrase's history).<\/li><li><b>Selective:<\/b> pauperism and LPC; Know-Nothings; Chinese exclusion; eugenics and the 1924 quotas.<\/li><li><b>Erased:<\/b> “the border crossed us” (Ellis); Native nations and domestic foreignness (Parker); enslaved Africans as forced migrants.<\/li><\/ol><p><b>Complication:<\/b> immigrants themselves used the ideal to fight exclusion (Saum Song Bo, Wong Chin Foo, Hoar). <b>So what:<\/b> the phrase is a political argument, not a neutral description (concept history).<\/p>","rubric":["A clear, arguable thesis that answers the question","At least five keywords used accurately, with dates","At least three readings cited by author","Change over time (what changed, what stayed, why)","A counterpoint or complication","A conclusion that answers “so what?”"]},{"id":"ES5","mod":"essay","kind":"self","diff":3,"tag":"","stem":"<b>Essay practice.<\/b> How did Americans debate assimilation and loyalty between the 1850s and the 1920s, and why did the answers grow more coercive?<div class='hint'>Spend 5 minutes on an outline: thesis + three sections + keywords + authors. Write it out if you have 25 minutes.<\/div>","model":"<p><b>Thesis option:<\/b> Debates moved from religion (Catholics in the 1850s) to race and heredity (new immigrants in the 1900s), and war turned assimilation from invitation into demand.<\/p><ol><li><b>Religion and politics:<\/b> Know-Nothings, “America for the Americans,” Spalding's defense; hyphen attacks begin (Morse).<\/li><li><b>Progressive answers:<\/b> melting pot (Zangwill; Andrews) vs. eugenics (Ross, Grant); settlement houses and Americanization (Addams); in-between peoples vs. white on arrival.<\/li><li><b>War and closure:<\/b> hyphenates, 100% Americanism, Red Scare deportations; Literacy Test; quotas. Later echo: the model minority label.<\/li><\/ol><p><b>Complication:<\/b> pluralism (Addams' Labor Museum) shows a gentler alternative. <b>So what:<\/b> belonging depended on conformity and loyalty, not just law.<\/p>","rubric":["A clear, arguable thesis that answers the question","At least five keywords used accurately, with dates","At least three readings cited by author","Change over time (what changed, what stayed, why)","A counterpoint or complication","A conclusion that answers “so what?”"]}],"mock":[{"n":"1","sec":"Part I. Identifications (5 pts each): define, give historical context and a reading, explain significance","pts":5,"kind":"self","stem":"<b>“asylum for all mankind”<\/b>","model":"<span class='muted small'>January 1776 · Paine, <i>Common Sense<\/i><\/span><ul><li>From Thomas Paine's <i>Common Sense<\/i> (1776): America as an “asylum for the persecuted lovers of civil and religious liberty from every part of Europe,” and his call to “prepare in time an asylum for mankind.”<\/li><li>Context: the case for independence. Paine argued that Europe, not England, was America's parent country, tying the Revolution to welcoming refugees from monarchy.<\/li><li>Course definition: an early revolutionary ideal welcoming refugees, especially from republican, anti-monarchical struggles like America's own.<\/li><li>Limits: the welcome imagined was European and largely Protestant; by 1798 the Alien Friends Act let the president deport foreigners he judged dangerous, aimed at radicals.<\/li><li>Significance: an origin point for the “nation of immigrants” self-image and later refugee rhetoric, always in tension with fear of foreign radicals.<\/li><\/ul>","rubric":["Defined the term precisely","Placed it in time and named key people or institutions","Tied it to a specific reading and its author's argument","Explained its significance (what it changed, who gained or lost)","Connected it to at least one other keyword"]},{"n":"2","sec":"Part I. Identifications (5 pts each): define, give historical context and a reading, explain significance","pts":5,"kind":"self","stem":"<b>Naturalization Act (1790)<\/b>","model":"<span class='muted small'>March 1790 · 1790 Act (primary); Zolberg; Ngai<\/span><ul><li>First federal naturalization law (1790): any alien who was a “free white person” of good character, with two years' residence, could become a citizen in any court.<\/li><li>Children born abroad to citizen fathers were citizens (jus sanguinis).<\/li><li>Made whiteness a legal condition of naturalization; this racial bar shaped membership until 1952 (Asians were barred until the 1940s–1952).<\/li><li>Residency rose to 5 years (1795) and 14 years (1798, Federalist fear of radical immigrants) before returning to 5 (1802).<\/li><li>Zolberg's “nation by design”: fast, cheap naturalization served a land-rich republic that wanted European settlers.<\/li><li>Connect: 1870 opened naturalization to people of African descent only; “aliens ineligible for citizenship” (1924) built on the racial bar.<\/li><\/ul>","rubric":["Defined the term precisely","Placed it in time and named key people or institutions","Tied it to a specific reading and its author's argument","Explained its significance (what it changed, who gained or lost)","Connected it to at least one other keyword"]},{"n":"3","sec":"Part I. Identifications (5 pts each): define, give historical context and a reading, explain significance","pts":5,"kind":"self","stem":"<b>Mayor of the City of New York v. Miln (1837)<\/b>","model":"<span class='muted small'>1837 · Parker; Zolberg<\/span><ul><li>Supreme Court, 1837: upheld a New York law requiring ship masters to report each passenger's name, age, birthplace and occupation, to protect the city from people likely to need relief.<\/li><li>The Court's first ruling on the constitutionality of state immigration laws (Parker).<\/li><li>Reasoning: a valid exercise of the state's police power, not an interference with Congress's commerce power; the opinion compared paupers to a “moral pestilence.”<\/li><li>Effect: emboldened Massachusetts and New York to switch from bonds to per-passenger fees (Parker).<\/li><li>Context: the justices protected states' power to control their “internal foreigners,” including free Black people (Parker).<\/li><li>Later limited by the Passenger Cases (1849) and overtaken by federalization.<\/li><\/ul>","rubric":["Defined the term precisely","Placed it in time and named key people or institutions","Tied it to a specific reading and its author's argument","Explained its significance (what it changed, who gained or lost)","Connected it to at least one other keyword"]},{"n":"4","sec":"Part I. Identifications (5 pts each): define, give historical context and a reading, explain significance","pts":5,"kind":"self","stem":"<b>Know-Nothings<\/b>","model":"<span class='muted small'>1850s; peak 1854–56 · Zolberg; “America for the Americans” (1855); Whitney (1856); Spalding (1855)<\/span><ul><li>Nativist movement and party of the 1850s (the American Party), grown from secret lodges; members told outsiders they “knew nothing.”<\/li><li>Target: mass Irish and German Catholic immigration after the Irish famine; fears of papal power, pauperism, crime and immigrant voting.<\/li><li>Program (Zolberg; Whitney's <i>Defence of the American Policy<\/i>; the “America for the Americans” editorial): a 21-year wait for naturalization, office for the native-born only, literacy tests and stricter voter registration.<\/li><li>Peak: swept Massachusetts in 1854; ran Millard Fillmore for president in 1856; collapsed over slavery.<\/li><li>Catholic answer: Bishop Martin Spalding's pastoral letter (1855), written after Louisville's “Bloody Monday” riot, defended immigrants' rights.<\/li><li>Significance: the first mass nativist party; it tied religion and foreignness to political danger, and its ideas returned in later restriction.<\/li><\/ul>","rubric":["Defined the term precisely","Placed it in time and named key people or institutions","Tied it to a specific reading and its author's argument","Explained its significance (what it changed, who gained or lost)","Connected it to at least one other keyword"]},{"n":"5","sec":"Part I. Identifications (5 pts each): define, give historical context and a reading, explain significance","pts":5,"kind":"self","stem":"<b>“coolie”<\/b>","model":"<span class='muted small'>1840s–1880s · Kenny; Gabaccia; lecture<\/span><ul><li>Definition: a racializing, derogatory label for Asian laborers (Chinese and South Asian) transported under oppressive, debt-bound contracts.<\/li><li>Context: after slavery ended in the British Empire, a “coolie trade” shipped indentured workers to Cuba, Peru and the Caribbean under brutal conditions.<\/li><li>Republicans cast “coolieism” as a new form of slavery; Congress barred American ships from the coolie trade in 1862.<\/li><li>Kenny: this antislavery logic became the starting point of federal immigration policy (the anti-coolie law, the Page Act).<\/li><li>The label was stretched to all Chinese workers, picturing them as unfree and servile by race, which fed exclusion (1875, 1882).<\/li><li>Lecture: “coolie” tied race to unfree, cheap labor that threatened white “free labor” and manhood.<\/li><\/ul>","rubric":["Defined the term precisely","Placed it in time and named key people or institutions","Tied it to a specific reading and its author's argument","Explained its significance (what it changed, who gained or lost)","Connected it to at least one other keyword"]},{"n":"6","sec":"Part I. Identifications (5 pts each): define, give historical context and a reading, explain significance","pts":5,"kind":"self","stem":"<b>Page Act (1875)<\/b>","model":"<span class='muted small'>March 1875 · Page Act (primary); Kenny; lecture<\/span><ul><li>The first federal restrictive immigration law (1875), sponsored by Rep. Horace Page of California.<\/li><li>Barred Asian laborers brought without their consent (“coolies”), women brought for prostitution, and convicts; required U.S. consuls in Asian ports to screen emigrants (remote control).<\/li><li>In practice it targeted Chinese women, presumed to be prostitutes, blocking family formation and keeping Chinese communities mostly male.<\/li><li>Kenny: grew out of antislavery politics, treating coolie labor and prostitution as forms of slavery.<\/li><li>Same moment as Chy Lung (1876), which said such control belonged to the federal government.<\/li><li>Significance: race, gender and labor fused in the first federal exclusion.<\/li><\/ul>","rubric":["Defined the term precisely","Placed it in time and named key people or institutions","Tied it to a specific reading and its author's argument","Explained its significance (what it changed, who gained or lost)","Connected it to at least one other keyword"]},{"n":"7","sec":"Part I. Identifications (5 pts each): define, give historical context and a reading, explain significance","pts":5,"kind":"self","stem":"<b>Chae Chan Ping v. United States (1889)<\/b>","model":"<span class='muted small'>1889 · Núñez; lecture<\/span><ul><li>“The Chinese Exclusion Case.” Chae Chan Ping, a laborer living in San Francisco since 1875, left for China in 1887 with a certificate guaranteeing his return.<\/li><li>While he was at sea, the Scott Act (1888) voided all such certificates, and he was refused re-entry.<\/li><li>The Supreme Court (Justice Field, unanimous) upheld his exclusion: the power to exclude foreigners is part of national sovereignty, held by the federal government, and Congress may override a treaty (Burlingame) by a later law.<\/li><li>The opinion described Chinese migration in invasion language (“vast hordes”), which Núñez highlights.<\/li><li>Significance: the origin of the plenary power doctrine.<\/li><\/ul>","rubric":["Defined the term precisely","Placed it in time and named key people or institutions","Tied it to a specific reading and its author's argument","Explained its significance (what it changed, who gained or lost)","Connected it to at least one other keyword"]},{"n":"8","sec":"Part I. Identifications (5 pts each): define, give historical context and a reading, explain significance","pts":5,"kind":"self","stem":"<b>United States v. Wong Kim Ark (1898)<\/b>","model":"<span class='muted small'>1898 · Lecture; course handout<\/span><ul><li>Wong Kim Ark was born in San Francisco (1873) to Chinese parents who lived there but could not naturalize; returning from China in 1895, he was refused entry as a non-citizen.<\/li><li>Supreme Court (Justice Gray, 6–2): he was a citizen by birth under the Fourteenth Amendment; jus soli applies regardless of parents' race or eligibility to naturalize.<\/li><li>Limits: his parents stayed barred from citizenship, exclusion continued, and Chinese Americans still faced suspicion at the border.<\/li><li>Significance: the foundation of birthright citizenship for immigrants' children, invoked in today's debates.<\/li><\/ul>","rubric":["Defined the term precisely","Placed it in time and named key people or institutions","Tied it to a specific reading and its author's argument","Explained its significance (what it changed, who gained or lost)","Connected it to at least one other keyword"]},{"n":"9","sec":"Part I. Identifications (5 pts each): define, give historical context and a reading, explain significance","pts":5,"kind":"self","stem":"<b>“in-between peoples”<\/b>","model":"<span class='muted small'>About 1895–1924 · Barrett & Roediger (1997)<\/span><ul><li>Barrett & Roediger (1997): “new immigrants” from southern and eastern Europe (about 1895–1924) held an “inbetween” racial status, neither fully white nor non-white.<\/li><li>Native-born Americans racialized them with slurs and doubted their fitness, yet the law classed them as white for naturalization.<\/li><li>Workplaces and unions sorted jobs into “white man's work” and the rest; immigrants learned American race through work, housing and politics.<\/li><li>“Americanization from the bottom up”: becoming American included learning to distance oneself from Black and Asian workers.<\/li><li>Significance: whiteness was a process, not a given; this complicates simple assimilation stories. Contrast Guglielmo's “white on arrival.”<\/li><\/ul>","rubric":["Defined the term precisely","Placed it in time and named key people or institutions","Tied it to a specific reading and its author's argument","Explained its significance (what it changed, who gained or lost)","Connected it to at least one other keyword"]},{"n":"10","sec":"Part I. Identifications (5 pts each): define, give historical context and a reading, explain significance","pts":5,"kind":"self","stem":"<b>settlement house movement<\/b>","model":"<span class='muted small'>1880s–1920s; Hull-House 1889 · Addams, <i>Twenty Years at Hull-House<\/i> (1910)<\/span><ul><li>Definition: a Progressive-era reform movement (1880s–1920s) in which middle-class, often college-educated women lived among immigrant workers and offered services.<\/li><li>Jane Addams and Ellen Gates Starr founded Hull-House in Chicago (1889): kindergartens, English classes, clubs, labor and housing research.<\/li><li>Addams, “Immigrants and Their Children”: the Labor Museum honored immigrant crafts to bridge the gap between parents and Americanized children.<\/li><li>Mixed: real concern for social justice and an early cultural pluralism, but hierarchical and Americanizing.<\/li><li>Addams later won the Nobel Peace Prize (1931).<\/li><li>Significance: a reform response to the new immigration that did not call for restriction.<\/li><\/ul>","rubric":["Defined the term precisely","Placed it in time and named key people or institutions","Tied it to a specific reading and its author's argument","Explained its significance (what it changed, who gained or lost)","Connected it to at least one other keyword"]},{"n":"11","sec":"Part I. Identifications (5 pts each): define, give historical context and a reading, explain significance","pts":5,"kind":"self","stem":"<b>“aliens ineligible for citizenship”<\/b>","model":"<span class='muted small'>Ozawa 1922; Thind 1923; 1924 Act · Ngai; lecture (Oct 6); course handout<\/span><ul><li>Course definition: a euphemistic legal concept used to exclude Asian immigrants from U.S. citizenship.<\/li><li>Because naturalization was limited to “white persons” (1790) and people of African descent (1870), Asians could not naturalize: Ozawa (1922) ruled Japanese were not white; Thind (1923) ruled Asian Indians were not white in the common understanding.<\/li><li>The 1924 Act barred “aliens ineligible to citizenship,” excluding all Asians without naming them and ending the Gentlemen's Agreement with Japan (1907–08).<\/li><li>Also used in California's Alien Land Laws (1913, 1920) to bar Asians from owning land.<\/li><li>Ngai: it made Asian Americans permanent foreigners, whatever their place of birth.<\/li><li>Ended in steps: Chinese exclusion repealed in 1943; the McCarran-Walter Act (1952) ended racial bars on naturalization.<\/li><\/ul>","rubric":["Defined the term precisely","Placed it in time and named key people or institutions","Tied it to a specific reading and its author's argument","Explained its significance (what it changed, who gained or lost)","Connected it to at least one other keyword"]},{"n":"12","sec":"Part I. Identifications (5 pts each): define, give historical context and a reading, explain significance","pts":5,"kind":"self","stem":"<b>national origins quota system<\/b>","model":"<span class='muted small'>1921–1965 · Ngai; lecture (Oct 6, Oct 13)<\/span><ul><li>Definition: the system (1921–1965) that allocated immigration visas by nationality to preserve the nation's supposed ethnic makeup.<\/li><li>1921 Emergency Quota Act: 3% of each nationality in the 1910 census. 1924: 2% of the 1890 census, then from 1929 quotas based on the “national origins” of the 1920 white population.<\/li><li>Favored northwestern Europe (Britain, Germany, Ireland); slashed Italians, Poles, Jews and Greeks; Asians barred.<\/li><li>Ngai: the calculations were arbitrary and racialized; descendants of enslaved Africans and Native Americans were left out of the base population.<\/li><li>Lecture: quotas had a ceiling but no floor and no refugee provision, so Jewish refugees were blocked in the 1930s (the St. Louis, 1939).<\/li><li>Abolished by the 1965 Hart-Celler Act.<\/li><\/ul>","rubric":["Defined the term precisely","Placed it in time and named key people or institutions","Tied it to a specific reading and its author's argument","Explained its significance (what it changed, who gained or lost)","Connected it to at least one other keyword"]},{"n":"13","sec":"Part II. Essay (20 pts)","pts":20,"kind":"self","stem":"How did U.S. immigration and naturalization law use race to decide who could belong to the nation between 1790 and 1924? How did that change over time?","model":"<p><b>Thesis option:<\/b> Law didn't just reflect race; it made racial categories durable. Whiteness was a condition of membership from 1790, Asians became permanent foreigners, and by 1924 Europeans were ranked inside a single white race.<\/p><ol><li><b>Founding terms:<\/b> Naturalization Act 1790 (“free white persons”); jus soli vs. jus sanguinis; Parker's domestic foreignness (free Black people, Native nations); Dred Scott.<\/li><li><b>Reconstruction opens and closes:<\/b> Fourteenth Amendment and birthright citizenship; 1870 naturalization for people of African descent only; “coolie” and Kenny's antislavery origins; Page Act 1875; Chinese Exclusion 1882; Wong Kim Ark 1898 (birth vs. naturalization).<\/li><li><b>Ranking Europeans, barring Asians:<\/b> “inbetween peoples” vs. “white on arrival”; eugenics; Literacy Test 1917; Johnson-Reed 1924 and “aliens ineligible for citizenship” (Ngai's architecture of race).<\/li><\/ol><p><b>Complication:<\/b> Guglielmo vs. Barrett &amp; Roediger on whether Europeans were ever outside whiteness. <b>So what:<\/b> the “nation of immigrants” welcomed a racially defined “us.”<\/p>","rubric":["A clear, arguable thesis that answers the question","At least five keywords used accurately, with dates","At least three readings cited by author","Change over time (what changed, what stayed, why)","A counterpoint or complication","A conclusion that answers “so what?”"]}],"modules":[{"id":"frames","name":"Words, nation & sovereignty","short":"Words & nation","obj":"Week 2 · Gabaccia, Ellis, Kennedy, Núñez · lectures Sep 1–8","why":"","html":"<p>Concept history treats words as tools that draw lines between insiders and outsiders. Start every essay by asking who uses a term, for whom, and what it hides.<\/p><ul class='kwl'><li><b>“nation of immigrants”<\/b> Self-image of the U.S. as built by immigrants; JFK used it (1958) against the quota system; critics say it hides Native dispossession and slavery.<span class='km'>Popularized 1930s–60s; JFK pamphlet 1958 · Gabaccia; Kennedy; Ellis (critique)<\/span><\/li><li><b>contributionism<\/b> Defending immigrants by listing what they contribute (labor, culture, wealth, service); makes belonging conditional on usefulness.<span class='km'>Progressive era (Andrews, 1914); JFK, 1958 · Kennedy; Andrews (Opposing Viewpoints); lecture<\/span><\/li><li><b>emigrant vs. immigrant<\/b> Same person, two vantage points: “em-” = leaving (seen from home), “im-” = arriving (seen by the receiving nation).<span class='km'>Usage shifts around the Civil War decades · Gabaccia; lecture; Núñez<\/span><\/li><li><b>“the border crossed us”<\/b> Slogan: Mexican Americans and Native peoples became “foreign” because U.S. borders moved over their land through conquest.<span class='km'>Chicano and Native activism; rooted in 1848 · Ellis<\/span><\/li><li><b>sovereignty<\/b> A state's supreme, exclusive authority over its territory; claimed as the source of the power to admit, exclude and expel.<span class='km'>From the founding; legal peak 1889 · Lecture; Ellis; Chae Chan Ping<\/span><\/li><li><b>ethnonationalism<\/b> The nation as a people of shared descent or ethnicity, with a state that should belong to and preserve that group.<span class='km'>Recurring; in the U.S. from 1790 to 1924 and beyond · Lecture (Sep 8); Ngai; Know-Nothing texts<\/span><\/li><\/ul><div class='callout'><b>Don't mix these up:<\/b><ul><li>“nation of immigrants” vs. “the border crossed us”: celebration vs. the conquest it hides.<\/li><li>Contributionism vs. ethnonationalism: belonging earned by usefulness vs. belonging by descent.<\/li><li>Sovereignty is the root of plenary power (Chae Chan Ping).<\/li><\/ul><\/div>","example":"<p><b>How a full ID looks: contributionism.<\/b> Hit the five parts, in your own words:<\/p><ol><li><b>Define<\/b> it in one sentence.<\/li><li><b>Place<\/b> it: when, where, who.<\/li><li><b>Tie<\/b> it to a reading and that author's argument.<\/li><li><b>Significance:<\/b> what it changed, and who gained or lost.<\/li><li><b>Connect<\/b> it to another keyword.<\/li><\/ol><ul><li>Definition: arguing for immigrants' acceptance on the grounds of what they contribute to the nation: labor, skills, culture, wealth, military service.<\/li><li>Classic example: JFK's <i>A Nation of Immigrants<\/i> catalogues each group's “contribution” to American life.<\/li><li>Earlier version: A. Piatt Andrews answered restrictionists like E. A. Ross by pointing to immigrants' work and successful assimilation.<\/li><li>Lecture: immigrants held up as exemplars of social mobility; their usefulness is what justifies their presence.<\/li><li>Limit: belonging becomes conditional on usefulness, and the story celebrates “successful” European groups while those judged unproductive stay outside.<\/li><li>Connect: “nation of immigrants”; later the “model minority” label works the same way.<\/li><\/ul>","traps":["“nation of immigrants” vs. “the border crossed us”: celebration vs. the conquest it hides.","Contributionism vs. ethnonationalism: belonging earned by usefulness vs. belonging by descent.","Sovereignty is the root of plenary power (Chae Chan Ping)."]},{"id":"early","name":"Early republic & the “lost century”","short":"Early republic","obj":"Week 3 · Zolberg 99–125, Paine, 1790 Act, Alien Friends Act, Neuman","why":"","html":"<p>The early republic welcomed white European settlers (the 1790 Act) while states policed the poor, the sick and free Black people. Federal power acted indirectly, through ships.<\/p><ul class='kwl'><li><b>“asylum for all mankind”<\/b> Paine's revolutionary ideal of America as a refuge for people fleeing tyranny.<span class='km'>January 1776 · Paine, <i>Common Sense<\/i><\/span><\/li><li><b>Naturalization Act (1790)<\/b> First federal naturalization law: open to “free white persons” after two years' residence.<span class='km'>March 1790 · 1790 Act (primary); Zolberg; Ngai<\/span><\/li><li><b>jus soli / jus sanguinis<\/b> Citizenship by place of birth (soil) vs. through a parent's citizenship (blood).<span class='km'>English common law; U.S. 1790 and 1868 · Parker; Zolberg; Núñez<\/span><\/li><li><b>Passenger Acts (1803, 1819, 1847/48, 1855/1882)<\/b> Laws regulating migrant ships (passengers per ton, space, food, lists): early, indirect immigration policy and “remote control.”<span class='km'>1803 (British); U.S. 1819 to 1882 · Zolberg; Neuman; Parker<\/span><\/li><li><b>remote control / border externalization<\/b> Controlling migration before migrants reach U.S. soil: ship rules, consuls, visas, enforcement pushed abroad.<span class='km'>1819 onward; full form after WWI (1924 visas) · Zolberg; lecture (Oct 6)<\/span><\/li><li><b>pauperism<\/b> Dependence on poor relief; fear of immigrant paupers drove most state immigration laws and became the federal “public charge” bar.<span class='km'>Colonial era to 1882 · Zolberg; Neuman; Parker; lecture<\/span><\/li><li><b>federalization<\/b> The shift of power over immigration from states and localities to the federal government, mostly in the 1870s–1890s.<span class='km'>Mainly 1849–1891 · Neuman; Kenny; Parker; lecture<\/span><\/li><\/ul><div class='callout'><b>Don't mix these up:<\/b><ul><li>The 1803 Passenger Act is British; 1819 is the first U.S. one.<\/li><li>Remote control (Zolberg) runs from ship rules (1819) to consular visas (1924).<\/li><li>Neuman's “lost century” means states regulated heavily; borders were never simply open.<\/li><\/ul><\/div>","example":"<p><b>How a full ID looks: Naturalization Act (1790).<\/b> Hit the five parts, in your own words:<\/p><ol><li><b>Define<\/b> it in one sentence.<\/li><li><b>Place<\/b> it: when, where, who.<\/li><li><b>Tie<\/b> it to a reading and that author's argument.<\/li><li><b>Significance:<\/b> what it changed, and who gained or lost.<\/li><li><b>Connect<\/b> it to another keyword.<\/li><\/ol><ul><li>First federal naturalization law (1790): any alien who was a “free white person” of good character, with two years' residence, could become a citizen in any court.<\/li><li>Children born abroad to citizen fathers were citizens (jus sanguinis).<\/li><li>Made whiteness a legal condition of naturalization; this racial bar shaped membership until 1952 (Asians were barred until the 1940s–1952).<\/li><li>Residency rose to 5 years (1795) and 14 years (1798, Federalist fear of radical immigrants) before returning to 5 (1802).<\/li><li>Zolberg's “nation by design”: fast, cheap naturalization served a land-rich republic that wanted European settlers.<\/li><li>Connect: 1870 opened naturalization to people of African descent only; “aliens ineligible for citizenship” (1924) built on the racial bar.<\/li><\/ul>","traps":["The 1803 Passenger Act is British; 1819 is the first U.S. one.","Remote control (Zolberg) runs from ship rules (1819) to consular visas (1924).","Neuman's “lost century” means states regulated heavily; borders were never simply open."]},{"id":"ante","name":"Antebellum states, slavery & nativism","short":"Antebellum","obj":"Week 4 · Zolberg 125–165, Parker, Nichols, Whitney, “America for the Americans,” Spalding","why":"","html":"<p>Mass Irish and German immigration met state police power, commerce-clause fights and the Know-Nothings. Slavery explains why states clung to control over who entered.<\/p><ul class='kwl'><li><b>police power<\/b> States' inherent power over health, safety, welfare and morals; the legal basis of state immigration control before federalization.<span class='km'>Antebellum era to 1876 · Parker; Zolberg; Neuman<\/span><\/li><li><b>commerce clause<\/b> Congress's power over foreign and interstate commerce; the main early hook for federal control of migrant passengers.<span class='km'>Constitution 1787; key cases 1824–1884 · Parker; Kenny<\/span><\/li><li><b>Gibbons v. Ogden (1824)<\/b> Marshall Court: commerce includes navigation and federal law controls it; later the precedent for treating passenger ships as federal business.<span class='km'>1824 · Parker; Zolberg<\/span><\/li><li><b>Mayor of the City of New York v. Miln (1837)<\/b> Upheld New York's passenger-reporting law as a valid use of state police power; the first Supreme Court look at state immigration laws.<span class='km'>1837 · Parker; Zolberg<\/span><\/li><li><b>“domestic foreignness”<\/b> Being inside the nation yet treated as foreign: free Black people, Native nations, paupers and others in antebellum America.<span class='km'>Antebellum era; echoes after 1898 · Parker, “Blacks, Indians, and Other Aliens”<\/span><\/li><li><b>Know-Nothings<\/b> 1850s anti-Catholic, anti-immigrant party (American Party) that demanded a 21-year naturalization wait and native-born officeholders.<span class='km'>1850s; peak 1854–56 · Zolberg; “America for the Americans” (1855); Whitney (1856); Spalding (1855)<\/span><\/li><\/ul><div class='callout'><b>Don't mix these up:<\/b><ul><li>Miln (1837) = state police power wins; Gibbons (1824) = broad federal commerce.<\/li><li>Parker's “internal foreigners” connect free Black people, Native nations and immigrants.<\/li><li>Know-Nothings (1850s) vs. Spalding's defense of immigrants.<\/li><\/ul><\/div>","example":"<p><b>How a full ID looks: Mayor of the City of New York v. Miln (1837).<\/b> Hit the five parts, in your own words:<\/p><ol><li><b>Define<\/b> it in one sentence.<\/li><li><b>Place<\/b> it: when, where, who.<\/li><li><b>Tie<\/b> it to a reading and that author's argument.<\/li><li><b>Significance:<\/b> what it changed, and who gained or lost.<\/li><li><b>Connect<\/b> it to another keyword.<\/li><\/ol><ul><li>Supreme Court, 1837: upheld a New York law requiring ship masters to report each passenger's name, age, birthplace and occupation, to protect the city from people likely to need relief.<\/li><li>The Court's first ruling on the constitutionality of state immigration laws (Parker).<\/li><li>Reasoning: a valid exercise of the state's police power, not an interference with Congress's commerce power; the opinion compared paupers to a “moral pestilence.”<\/li><li>Effect: emboldened Massachusetts and New York to switch from bonds to per-passenger fees (Parker).<\/li><li>Context: the justices protected states' power to control their “internal foreigners,” including free Black people (Parker).<\/li><li>Later limited by the Passenger Cases (1849) and overtaken by federalization.<\/li><\/ul>","traps":["Miln (1837) = state police power wins; Gibbons (1824) = broad federal commerce.","Parker's “internal foreigners” connect free Black people, Native nations and immigrants.","Know-Nothings (1850s) vs. Spalding's defense of immigrants."]},{"id":"labor","name":"Reconstruction, labor & citizenship","short":"Labor & citizenship","obj":"Week 5 · Kenny, Zolberg 166–175, Erickson, 1870 Act, Foran Act","why":"","html":"<p>Kenny: federal immigration policy grew out of antislavery politics. Reconstruction expanded citizenship (14th Amendment) while new fears of unfree “coolie” labor shaped what came next.<\/p><ul class='kwl'><li><b>contract labor<\/b> Workers recruited abroad under contracts binding them to work off their passage; encouraged in 1864, banned in 1885.<span class='km'>1864 Act; banned 1885 · Erickson; Kenny; Gabaccia<\/span><\/li><li><b>“coolie”<\/b> Racializing label for Asian laborers bound by oppressive contracts; antislavery politics turned it into a reason for exclusion.<span class='km'>1840s–1880s · Kenny; Gabaccia; lecture<\/span><\/li><li><b>Burlingame Treaty (1868)<\/b> U.S.–China treaty recognizing free voluntary migration both ways, but expressly withholding naturalization.<span class='km'>1868; revised 1880 · Kenny; Zolberg; lecture<\/span><\/li><li><b>Fourteenth Amendment<\/b> Reconstruction amendment making everyone born or naturalized in the U.S. a citizen; overturned Dred Scott.<span class='km'>Ratified 1868 · Kenny; Núñez; Parker<\/span><\/li><li><b>birthright citizenship<\/b> Citizenship acquired automatically by birth on U.S. soil; constitutional since 1868, applied to immigrants' children in 1898.<span class='km'>Common law; 1868; 1898 · Kenny; Núñez; course handout<\/span><\/li><li><b>Foran Act (1885)<\/b> Alien Contract Labor Law: banned importing workers under labor contracts made before arrival.<span class='km'>February 1885 · Foran Act (primary); Erickson; Kenny<\/span><\/li><\/ul><div class='callout'><b>Don't mix these up:<\/b><ul><li>Birthright citizenship (born here) ≠ naturalization (still limited by race).<\/li><li>Contract labor was encouraged in 1864 and banned in 1885 (Foran Act).<\/li><li>Burlingame (1868) protected migration but not naturalization.<\/li><\/ul><\/div>","example":"<p><b>How a full ID looks: Burlingame Treaty (1868).<\/b> Hit the five parts, in your own words:<\/p><ol><li><b>Define<\/b> it in one sentence.<\/li><li><b>Place<\/b> it: when, where, who.<\/li><li><b>Tie<\/b> it to a reading and that author's argument.<\/li><li><b>Significance:<\/b> what it changed, and who gained or lost.<\/li><li><b>Connect<\/b> it to another keyword.<\/li><\/ol><ul><li>Treaty between the U.S. and China (Burlingame–Seward Treaty, 1868), negotiated for China by Anson Burlingame, a former U.S. minister there.<\/li><li>Recognized the “inherent and inalienable right” to change home and allegiance and free voluntary migration both ways; condemned involuntary (coolie) emigration.<\/li><li>Gave Chinese residents the privileges of the most favored nation but expressly did not grant naturalization (Kenny).<\/li><li>Served U.S. trade and labor needs (railroad building), part of Secretary of State Seward's proactive immigration policy (Zolberg).<\/li><li>Lecture: a form of shared sovereignty, two states cooperating over migration.<\/li><li>Became an obstacle to exclusion; the Angell Treaty (1880) let the U.S. “suspend” Chinese labor migration, opening the way to 1882. Chae Chan Ping (1889) later held Congress could override such treaties.<\/li><\/ul>","traps":["Birthright citizenship (born here) ≠ naturalization (still limited by race).","Contract labor was encouraged in 1864 and banned in 1885 (Foran Act).","Burlingame (1868) protected migration but not naturalization."]},{"id":"excl","name":"Chinese exclusion & the courts","short":"Exclusion & courts","obj":"Week 5 · Lew-Williams, Page Act, Exclusion Act, Saum Song Bo, Wong Chin Foo, Hoar","why":"","html":"<p>From 1875 to 1898, Chinese exclusion built the federal gatekeeping state and its legal doctrine: federal control (Chy Lung), sovereignty and plenary power (Chae Chan Ping), and birthright citizenship's limit on exclusion (Wong Kim Ark).<\/p><ul class='kwl'><li><b>Page Act (1875)<\/b> First federal restrictive immigration law: barred coerced Asian laborers, women brought for prostitution, and convicts; used against Chinese women.<span class='km'>March 1875 · Page Act (primary); Kenny; lecture<\/span><\/li><li><b>Chy Lung v. Freeman (1875)<\/b> Struck down California's bond law used to detain 22 Chinese women: admitting foreigners belongs to the federal government.<span class='km'>Argued 1875, decided 1876 · Lecture (Sep 23)<\/span><\/li><li><b>Chinese Exclusion Act (1882)<\/b> Suspended Chinese laborers' immigration for 10 years and barred Chinese naturalization: the first exclusion by race and nationality.<span class='km'>May 1882; repealed 1943 · Lew-Williams; Hoar; Saum Song Bo; Wong Chin Foo; Gabaccia<\/span><\/li><li><b>“likely to become a public charge” (LPC)<\/b> A discretionary filter excluding immigrants judged likely to need public support; used against the poor, women, the disabled and refugees.<span class='km'>1882 / 1891; used in the 1930s · Zolberg; eugenics reading; lecture (Oct 6)<\/span><\/li><li><b>Chae Chan Ping v. United States (1889)<\/b> “The Chinese Exclusion Case”: power to exclude foreigners is part of sovereignty, and Congress may override a treaty.<span class='km'>1889 · Núñez; lecture<\/span><\/li><li><b>plenary power doctrine<\/b> Courts' deference to Congress and the executive on immigration: near-absolute, largely unreviewable power.<span class='km'>1889–1893 cases onward · Course handout; lecture<\/span><\/li><li><b>United States v. Wong Kim Ark (1898)<\/b> A child born in the U.S. to Chinese parents is a citizen by birth under the Fourteenth Amendment.<span class='km'>1898 · Lecture; course handout<\/span><\/li><\/ul><div class='callout'><b>Don't mix these up:<\/b><ul><li>Page Act (1875) = coerced laborers, prostitution, convicts; Exclusion Act (1882) = all Chinese laborers, 10 years.<\/li><li>Chy Lung = federal power over admission; Chae Chan Ping = sovereignty and plenary power.<\/li><li>Wong Kim Ark (1898) = citizenship by birth, not naturalization.<\/li><\/ul><\/div>","example":"<p><b>How a full ID looks: Chae Chan Ping v. United States (1889).<\/b> Hit the five parts, in your own words:<\/p><ol><li><b>Define<\/b> it in one sentence.<\/li><li><b>Place<\/b> it: when, where, who.<\/li><li><b>Tie<\/b> it to a reading and that author's argument.<\/li><li><b>Significance:<\/b> what it changed, and who gained or lost.<\/li><li><b>Connect<\/b> it to another keyword.<\/li><\/ol><ul><li>“The Chinese Exclusion Case.” Chae Chan Ping, a laborer living in San Francisco since 18
