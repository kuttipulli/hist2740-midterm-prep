75, left for China in 1887 with a certificate guaranteeing his return.<\/li><li>While he was at sea, the Scott Act (1888) voided all such certificates, and he was refused re-entry.<\/li><li>The Supreme Court (Justice Field, unanimous) upheld his exclusion: the power to exclude foreigners is part of national sovereignty, held by the federal government, and Congress may override a treaty (Burlingame) by a later law.<\/li><li>The opinion described Chinese migration in invasion language (“vast hordes”), which Núñez highlights.<\/li><li>Significance: the origin of the plenary power doctrine.<\/li><\/ul>","traps":["Page Act (1875) = coerced laborers, prostitution, convicts; Exclusion Act (1882) = all Chinese laborers, 10 years.","Chy Lung = federal power over admission; Chae Chan Ping = sovereignty and plenary power.","Wong Kim Ark (1898) = citizenship by birth, not naturalization."]},{"id":"newimm","name":"The new immigration & the melting pot","short":"New immigration","obj":"Week 6 · Barrett & Roediger, Ross & Andrews, Addams, Guglielmo","why":"","html":"<p>About 23 million people arrived from 1880 to 1920, mostly from southern and eastern Europe. Reformers, eugenicists and the immigrants themselves argued over assimilation, race and whiteness.<\/p><ul class='kwl'><li><b>melting pot<\/b> Metaphor of immigrants fusing into one new American people; in practice, assimilation to Anglo-Protestant norms.<span class='km'>Zangwill's play, 1908 · Ross & Andrews (Opposing Viewpoints); Addams; lecture<\/span><\/li><li><b>Americanization<\/b> Campaigns to make European immigrants conform to Anglo-Protestant language, habits and loyalties.<span class='km'>1900s–1920s; coercive in WWI · Addams; Barrett & Roediger; Guglielmo; lecture<\/span><\/li><li><b>settlement house movement<\/b> Progressive reformers living among immigrants to offer services; Jane Addams' Hull-House in Chicago.<span class='km'>1880s–1920s; Hull-House 1889 · Addams, <i>Twenty Years at Hull-House<\/i> (1910)<\/span><\/li><li><b>“in-between peoples”<\/b> New immigrants from southern and eastern Europe held an “inbetween” racial status, neither securely white nor non-white.<span class='km'>About 1895–1924 · Barrett & Roediger (1997)<\/span><\/li><li><b>“white on arrival”<\/b> Italians were treated as white by “color” from arrival, even while seen as an inferior “race.”<span class='km'>Chicago, 1890–1945 · Guglielmo, <i>White on Arrival<\/i><\/span><\/li><li><b>eugenics<\/b> Pseudo-science of “improving” heredity; gave restriction (1917, 1924) a scientific veneer.<span class='km'>1900s–1920s · Immigration and eugenics reading (Grant, 1916); Ross; Ngai; lecture<\/span><\/li><\/ul><div class='callout'><b>Don't mix these up:<\/b><ul><li>“Inbetween” (Barrett & Roediger) vs. “white on arrival” (Guglielmo): race as process vs. color as given.<\/li><li>Melting pot (fusion) vs. settlement-house pluralism vs. eugenic restriction.<\/li><li>Ross = restriction and eugenics; Andrews = assimilation optimism.<\/li><\/ul><\/div>","example":"<p><b>How a full ID looks: “in-between peoples”.<\/b> Hit the five parts, in your own words:<\/p><ol><li><b>Define<\/b> it in one sentence.<\/li><li><b>Place<\/b> it: when, where, who.<\/li><li><b>Tie<\/b> it to a reading and that author's argument.<\/li><li><b>Significance:<\/b> what it changed, and who gained or lost.<\/li><li><b>Connect<\/b> it to another keyword.<\/li><\/ol><ul><li>Barrett & Roediger (1997): “new immigrants” from southern and eastern Europe (about 1895–1924) held an “inbetween” racial status, neither fully white nor non-white.<\/li><li>Native-born Americans racialized them with slurs and doubted their fitness, yet the law classed them as white for naturalization.<\/li><li>Workplaces and unions sorted jobs into “white man's work” and the rest; immigrants learned American race through work, housing and politics.<\/li><li>“Americanization from the bottom up”: becoming American included learning to distance oneself from Black and Asian workers.<\/li><li>Significance: whiteness was a process, not a given; this complicates simple assimilation stories. Contrast Guglielmo's “white on arrival.”<\/li><\/ul>","traps":["“Inbetween” (Barrett & Roediger) vs. “white on arrival” (Guglielmo): race as process vs. color as given.","Melting pot (fusion) vs. settlement-house pluralism vs. eugenic restriction.","Ross = restriction and eugenics; Andrews = assimilation optimism."]},{"id":"quotas","name":"The doors close, 1917–1945","short":"Quotas","obj":"Week 7 · Ngai, Grant, cartoons, Daniels, Taylor","why":"","html":"<p>WWI loyalty politics, the 1917 literacy test and the 1921/1924 quotas closed the doors. The 1924 Act's “architecture of race” lasted until 1965.<\/p><ul class='kwl'><li><b>“100% Americanism”<\/b> WWI-era demand for total, undivided loyalty and cultural conformity from immigrants.<span class='km'>About 1915–1920s · Lecture (Oct 6); Barrett & Roediger<\/span><\/li><li><b>“hyphenates”<\/b> Derisive label for ethnic Americans with dual identities, accused of divided loyalty.<span class='km'>1910s (roots in the 1850s) · Lecture (Oct 6); Zolberg<\/span><\/li><li><b>Literacy Test (1917 Act)<\/b> Immigration Act of 1917 (passed over Wilson's veto): reading test aimed at southern and eastern Europeans; also the Asiatic Barred Zone.<span class='km'>February 1917 · Lecture (Oct 6); Zolberg; Gabaccia<\/span><\/li><li><b>Johnson-Reed Act (1924)<\/b> Immigration Act of 1924: national-origins quotas, Asian exclusion, consular visas; Western Hemisphere left unrestricted.<span class='km'>May 1924; in force to 1965 · Ngai, “The Architecture of Race”; lecture<\/span><\/li><li><b>“aliens ineligible for citizenship”<\/b> Euphemistic legal category used to exclude Asians, who were barred from naturalization by race.<span class='km'>Ozawa 1922; Thind 1923; 1924 Act · Ngai; lecture (Oct 6); course handout<\/span><\/li><li><b>national origins quota system<\/b> System allocating visas by nationality to preserve the nation's supposed ethnic makeup; favored northwestern Europe.<span class='km'>1921–1965 · Ngai; lecture (Oct 6, Oct 13)<\/span><\/li><li><b>model minority<\/b> Label for groups seen as hardworking and quiet, mostly Asian Americans; used to deny racism and discipline other groups.<span class='km'>Coined 1966; roots in postwar resettlement · Course handout; Taylor; lecture<\/span><\/li><\/ul><div class='callout'><b>Don't mix these up:<\/b><ul><li>1921 = 3% of 1910; 1924 = 2% of 1890, then national origins.<\/li><li>“Aliens ineligible for citizenship” = Asians (Ozawa, Thind).<\/li><li>Hyphenates and 100% Americanism = WWI loyalty politics.<\/li><\/ul><\/div>","example":"<p><b>How a full ID looks: “aliens ineligible for citizenship”.<\/b> Hit the five parts, in your own words:<\/p><ol><li><b>Define<\/b> it in one sentence.<\/li><li><b>Place<\/b> it: when, where, who.<\/li><li><b>Tie<\/b> it to a reading and that author's argument.<\/li><li><b>Significance:<\/b> what it changed, and who gained or lost.<\/li><li><b>Connect<\/b> it to another keyword.<\/li><\/ol><ul><li>Course definition: a euphemistic legal concept used to exclude Asian immigrants from U.S. citizenship.<\/li><li>Because naturalization was limited to “white persons” (1790) and people of African descent (1870), Asians could not naturalize: Ozawa (1922) ruled Japanese were not white; Thind (1923) ruled Asian Indians were not white in the common understanding.<\/li><li>The 1924 Act barred “aliens ineligible to citizenship,” excluding all Asians without naming them and ending the Gentlemen's Agreement with Japan (1907–08).<\/li><li>Also used in California's Alien Land Laws (1913, 1920) to bar Asians from owning land.<\/li><li>Ngai: it made Asian Americans permanent foreigners, whatever their place of birth.<\/li><li>Ended in steps: Chinese exclusion repealed in 1943; the McCarran-Walter Act (1952) ended racial bars on naturalization.<\/li><\/ul>","traps":["1921 = 3% of 1910; 1924 = 2% of 1890, then national origins.","“Aliens ineligible for citizenship” = Asians (Ozawa, Thind).","Hyphenates and 100% Americanism = WWI loyalty politics."]},{"id":"essay","name":"The essay","short":"Essay","obj":"One longer essay on a broad theme tied to the keywords","why":"","html":"<p>The essay asks about a broad concept that runs through several keywords. Lecture advice: more detail is better, outline before you write, show relationships between concepts, and embed details in the larger historical structure.<\/p><ol><li><b>Outline (3–5 min).<\/b> A thesis that answers the question with an argument, then three sections.<\/li><li><b>Each section:<\/b> a claim, 2–3 keywords as evidence (laws, cases, slogans with dates), and at least one author by name.<\/li><li><b>Show change over time.<\/b> What stayed the same, what changed, and why.<\/li><li><b>Complicate it.<\/b> One counterpoint (e.g., Guglielmo vs. Barrett &amp; Roediger, or Hoar vs. the exclusionists).<\/li><li><b>Close<\/b> by answering “so what?”, often back to the tension between “nation of immigrants” and exclusion.<\/li><\/ol><div class='callout'><b>Time:<\/b> with about 12 IDs, spend roughly 3–4 minutes each (about 45 minutes) and leave 25–30 minutes for the essay. Outline the essay first, so it's safe if time runs short.<\/div>","example":"<p><b>Five big themes<\/b> that tie most keywords together (each has a practice prompt with an outline):<\/p><ul><li>Race and citizenship<\/li><li>Who controls the border: states, the nation, sovereignty<\/li><li>Immigration policy as labor policy<\/li><li>“Nation of immigrants” vs. exclusion<\/li><li>Assimilation and loyalty<\/li><\/ul>","traps":["Listing keywords without an argument.","Summarizing one reading instead of using several.","No dates: “in the 1800s” loses points; “the Page Act (1875)” earns them."]}],"cards":{"ids":{"name":"All 45 IDs","note":"Front: the term. Back: the one-line version. Say the definition, date and reading out loud before you flip.","cards":[["“nation of immigrants”","Self-image of the U.S. as built by immigrants; JFK used it (1958) against the quota system; critics say it hides Native dispossession and slavery. <span class='muted'>(Popularized 1930s–60s; JFK pamphlet 1958 · Gabaccia; Kennedy; Ellis (critique))<\/span>"],["contributionism","Defending immigrants by listing what they contribute (labor, culture, wealth, service); makes belonging conditional on usefulness. <span class='muted'>(Progressive era (Andrews, 1914); JFK, 1958 · Kennedy; Andrews (Opposing Viewpoints); lecture)<\/span>"],["emigrant vs. immigrant","Same person, two vantage points: “em-” = leaving (seen from home), “im-” = arriving (seen by the receiving nation). <span class='muted'>(Usage shifts around the Civil War decades · Gabaccia; lecture; Núñez)<\/span>"],["“the border crossed us”","Slogan: Mexican Americans and Native peoples became “foreign” because U.S. borders moved over their land through conquest. <span class='muted'>(Chicano and Native activism; rooted in 1848 · Ellis)<\/span>"],["sovereignty","A state's supreme, exclusive authority over its territory; claimed as the source of the power to admit, exclude and expel. <span class='muted'>(From the founding; legal peak 1889 · Lecture; Ellis; Chae Chan Ping)<\/span>"],["ethnonationalism","The nation as a people of shared descent or ethnicity, with a state that should belong to and preserve that group. <span class='muted'>(Recurring; in the U.S. from 1790 to 1924 and beyond · Lecture (Sep 8); Ngai; Know-Nothing texts)<\/span>"],["“asylum for all mankind”","Paine's revolutionary ideal of America as a refuge for people fleeing tyranny. <span class='muted'>(January 1776 · Paine, <i>Common Sense<\/i>)<\/span>"],["Naturalization Act (1790)","First federal naturalization law: open to “free white persons” after two years' residence. <span class='muted'>(March 1790 · 1790 Act (primary); Zolberg; Ngai)<\/span>"],["jus soli / jus sanguinis","Citizenship by place of birth (soil) vs. through a parent's citizenship (blood). <span class='muted'>(English common law; U.S. 1790 and 1868 · Parker; Zolberg; Núñez)<\/span>"],["Passenger Acts (1803, 1819, 1847/48, 1855/1882)","Laws regulating migrant ships (passengers per ton, space, food, lists): early, indirect immigration policy and “remote control.” <span class='muted'>(1803 (British); U.S. 1819 to 1882 · Zolberg; Neuman; Parker)<\/span>"],["remote control / border externalization","Controlling migration before migrants reach U.S. soil: ship rules, consuls, visas, enforcement pushed abroad. <span class='muted'>(1819 onward; full form after WWI (1924 visas) · Zolberg; lecture (Oct 6))<\/span>"],["pauperism","Dependence on poor relief; fear of immigrant paupers drove most state immigration laws and became the federal “public charge” bar. <span class='muted'>(Colonial era to 1882 · Zolberg; Neuman; Parker; lecture)<\/span>"],["federalization","The shift of power over immigration from states and localities to the federal government, mostly in the 1870s–1890s. <span class='muted'>(Mainly 1849–1891 · Neuman; Kenny; Parker; lecture)<\/span>"],["police power","States' inherent power over health, safety, welfare and morals; the legal basis of state immigration control before federalization. <span class='muted'>(Antebellum era to 1876 · Parker; Zolberg; Neuman)<\/span>"],["commerce clause","Congress's power over foreign and interstate commerce; the main early hook for federal control of migrant passengers. <span class='muted'>(Constitution 1787; key cases 1824–1884 · Parker; Kenny)<\/span>"],["Gibbons v. Ogden (1824)","Marshall Court: commerce includes navigation and federal law controls it; later the precedent for treating passenger ships as federal business. <span class='muted'>(1824 · Parker; Zolberg)<\/span>"],["Mayor of the City of New York v. Miln (1837)","Upheld New York's passenger-reporting law as a valid use of state police power; the first Supreme Court look at state immigration laws. <span class='muted'>(1837 · Parker; Zolberg)<\/span>"],["“domestic foreignness”","Being inside the nation yet treated as foreign: free Black people, Native nations, paupers and others in antebellum America. <span class='muted'>(Antebellum era; echoes after 1898 · Parker, “Blacks, Indians, and Other Aliens”)<\/span>"],["Know-Nothings","1850s anti-Catholic, anti-immigrant party (American Party) that demanded a 21-year naturalization wait and native-born officeholders. <span class='muted'>(1850s; peak 1854–56 · Zolberg; “America for the Americans” (1855); Whitney (1856); Spalding (1855))<\/span>"],["contract labor","Workers recruited abroad under contracts binding them to work off their passage; encouraged in 1864, banned in 1885. <span class='muted'>(1864 Act; banned 1885 · Erickson; Kenny; Gabaccia)<\/span>"],["“coolie”","Racializing label for Asian laborers bound by oppressive contracts; antislavery politics turned it into a reason for exclusion. <span class='muted'>(1840s–1880s · Kenny; Gabaccia; lecture)<\/span>"],["Burlingame Treaty (1868)","U.S.–China treaty recognizing free voluntary migration both ways, but expressly withholding naturalization. <span class='muted'>(1868; revised 1880 · Kenny; Zolberg; lecture)<\/span>"],["Fourteenth Amendment","Reconstruction amendment making everyone born or naturalized in the U.S. a citizen; overturned Dred Scott. <span class='muted'>(Ratified 1868 · Kenny; Núñez; Parker)<\/span>"],["birthright citizenship","Citizenship acquired automatically by birth on U.S. soil; constitutional since 1868, applied to immigrants' children in 1898. <span class='muted'>(Common law; 1868; 1898 · Kenny; Núñez; course handout)<\/span>"],["Foran Act (1885)","Alien Contract Labor Law: banned importing workers under labor contracts made before arrival. <span class='muted'>(February 1885 · Foran Act (primary); Erickson; Kenny)<\/span>"],["Page Act (1875)","First federal restrictive immigration law: barred coerced Asian laborers, women brought for prostitution, and convicts; used against Chinese women. <span class='muted'>(March 1875 · Page Act (primary); Kenny; lecture)<\/span>"],["Chy Lung v. Freeman (1875)","Struck down California's bond law used to detain 22 Chinese women: admitting foreigners belongs to the federal government. <span class='muted'>(Argued 1875, decided 1876 · Lecture (Sep 23))<\/span>"],["Chinese Exclusion Act (1882)","Suspended Chinese laborers' immigration for 10 years and barred Chinese naturalization: the first exclusion by race and nationality. <span class='muted'>(May 1882; repealed 1943 · Lew-Williams; Hoar; Saum Song Bo; Wong Chin Foo; Gabaccia)<\/span>"],["“likely to become a public charge” (LPC)","A discretionary filter excluding immigrants judged likely to need public support; used against the poor, women, the disabled and refugees. <span class='muted'>(1882 / 1891; used in the 1930s · Zolberg; eugenics reading; lecture (Oct 6))<\/span>"],["Chae Chan Ping v. United States (1889)","“The Chinese Exclusion Case”: power to exclude foreigners is part of sovereignty, and Congress may override a treaty. <span class='muted'>(1889 · Núñez; lecture)<\/span>"],["plenary power doctrine","Courts' deference to Congress and the executive on immigration: near-absolute, largely unreviewable power. <span class='muted'>(1889–1893 cases onward · Course handout; lecture)<\/span>"],["United States v. Wong Kim Ark (1898)","A child born in the U.S. to Chinese parents is a citizen by birth under the Fourteenth Amendment. <span class='muted'>(1898 · Lecture; course handout)<\/span>"],["melting pot","Metaphor of immigrants fusing into one new American people; in practice, assimilation to Anglo-Protestant norms. <span class='muted'>(Zangwill's play, 1908 · Ross & Andrews (Opposing Viewpoints); Addams; lecture)<\/span>"],["Americanization","Campaigns to make European immigrants conform to Anglo-Protestant language, habits and loyalties. <span class='muted'>(1900s–1920s; coercive in WWI · Addams; Barrett & Roediger; Guglielmo; lecture)<\/span>"],["settlement house movement","Progressive reformers living among immigrants to offer services; Jane Addams' Hull-House in Chicago. <span class='muted'>(1880s–1920s; Hull-House 1889 · Addams, <i>Twenty Years at Hull-House<\/i> (1910))<\/span>"],["“in-between peoples”","New immigrants from southern and eastern Europe held an “inbetween” racial status, neither securely white nor non-white. <span class='muted'>(About 1895–1924 · Barrett & Roediger (1997))<\/span>"],["“white on arrival”","Italians were treated as white by “color” from arrival, even while seen as an inferior “race.” <span class='muted'>(Chicago, 1890–1945 · Guglielmo, <i>White on Arrival<\/i>)<\/span>"],["eugenics","Pseudo-science of “improving” heredity; gave restriction (1917, 1924) a scientific veneer. <span class='muted'>(1900s–1920s · Immigration and eugenics reading (Grant, 1916); Ross; Ngai; lecture)<\/span>"],["“100% Americanism”","WWI-era demand for total, undivided loyalty and cultural conformity from immigrants. <span class='muted'>(About 1915–1920s · Lecture (Oct 6); Barrett & Roediger)<\/span>"],["“hyphenates”","Derisive label for ethnic Americans with dual identities, accused of divided loyalty. <span class='muted'>(1910s (roots in the 1850s) · Lecture (Oct 6); Zolberg)<\/span>"],["Literacy Test (1917 Act)","Immigration Act of 1917 (passed over Wilson's veto): reading test aimed at southern and eastern Europeans; also the Asiatic Barred Zone. <span class='muted'>(February 1917 · Lecture (Oct 6); Zolberg; Gabaccia)<\/span>"],["Johnson-Reed Act (1924)","Immigration Act of 1924: national-origins quotas, Asian exclusion, consular visas; Western Hemisphere left unrestricted. <span class='muted'>(May 1924; in force to 1965 · Ngai, “The Architecture of Race”; lecture)<\/span>"],["“aliens ineligible for citizenship”","Euphemistic legal category used to exclude Asians, who were barred from naturalization by race. <span class='muted'>(Ozawa 1922; Thind 1923; 1924 Act · Ngai; lecture (Oct 6); course handout)<\/span>"],["national origins quota system","System allocating visas by nationality to preserve the nation's supposed ethnic makeup; favored northwestern Europe. <span class='muted'>(1921–1965 · Ngai; lecture (Oct 6, Oct 13))<\/span>"],["model minority","Label for groups seen as hardworking and quiet, mostly Asian Americans; used to deny racism and discipline other groups. <span class='muted'>(Coined 1966; roots in postwar resettlement · Course handout; Taylor; lecture)<\/span>"]]},"dates":{"name":"Key dates","note":"Front: the event. Back: the year. Dates anchor every ID.","cards":[["Paine, <i>Common Sense<\/i>","1776"],["First Naturalization Act (“free white persons”)","1790"],["Alien Friends Act","1798"],["First U.S. Passenger Act","1819"],["Gibbons v. Ogden","1824"],["Mayor of New York v. Miln","1837"],["Passenger Cases","1849"],["Know-Nothings sweep Massachusetts","1854"],["Dred Scott v. Sandford","1857"],["Ban on Americans in the coolie trade","1862"],["Act to Encourage Immigration (contract labor)","1864"],["Fourteenth Amendment · Burlingame Treaty","1868"],["Naturalization opened to people of African descent","1870"],["Page Act","1875"],["Chy Lung v. Freeman · Henderson (decided)","1876"],["Chinese Exclusion Act · Immigration Act (public charge)","1882"],["Foran Act","1885"],["Scott Act","1888"],["Chae Chan Ping · Hull-House founded","1889"],["Geary Act","1892"],["Wong Kim Ark","1898"],["Zangwill's <i>The Melting Pot<\/i>","1908"],["Literacy test · Asiatic Barred Zone","1917"],["Emergency Quota Act (3% of 1910)","1921"],["Ozawa · Thind","1922 · 1923"],["Johnson-Reed (2% of 1890) · Border Patrol","1924"],["Executive Order 9066","1942"],["Chinese exclusion repealed","1943"],["Quotas abolished (Hart-Celler)","1965"]]},"readings":{"name":"Readings","note":"Front: the author. Back: the argument in one line. Naming the author earns credit on IDs.","cards":[["Gabaccia","“Nation of immigrants” is a modern phrase; Americans shifted from “emigrants” to “immigrants” around the Civil War; words matter."],["Ellis","The border(s) crossed Native peoples too: settler colonialism underlies U.S. sovereignty and borders."],["Kennedy (1958)","<i>A Nation of Immigrants<\/i>: contributionism, written to end national-origins quotas."],["Núñez","Legal words (alien, immigrant, citizen) mark who belongs; courts used invasion language (Chae Chan Ping)."],["Zolberg","Policy was designed from the start: attract desirable Europeans, deter the poor, “remote control.”"],["Neuman","The “lost century”: states regulated migration (paupers, convicts, free Black people) before 1875."],["Parker","Free Black people, Native Americans and others were “internal foreigners”; slavery shaped state power over entry."],["Kenny","Federal immigration policy grew out of antislavery: anti-coolie law, the Page Act, Reconstruction."],["Erickson","The 1864 contract labor law targeted skilled British workers; the link to unskilled Asians wasn't based on fact."],["Lew-Williams","Exclusion plus anti-Chinese violence (1885–86) made the Chinese “the alien.”"],["Barrett &amp; Roediger","New immigrants were “inbetween” racially and learned whiteness while becoming American."],["Guglielmo","Italians were “white on arrival” by color, while seen as an inferior race."],["Ngai","The 1924 Act's “architecture of race”: ranked Europeans, barred Asians, created the illegal alien."],["Addams","Hull-House and the Labor Museum: bridging immigrant parents and Americanized children."],["Ross vs. Andrews","Ross: eugenic restriction. Andrews: assimilation (the melting pot) works."],["Hoar · Saum Song Bo · Wong Chin Foo","Voices against Chinese exclusion: betrayal of the Declaration; the Statue of Liberty's hypocrisy; equal rights."],["Daniels · Taylor","Japanese American incarceration (1942) and resettlement under pressure to assimilate."]]},"cases":{"name":"Court cases","note":"Front: the case. Back: what it decided and why it matters.","cards":[["Gibbons v. Ogden (1824)","Commerce includes navigation; federal law controls it."],["Mayor of New York v. Miln (1837)","Upheld state passenger reporting as police power; paupers a “moral pestilence.”"],["Passenger Cases (1849)","Struck down state head taxes on passengers (commerce clause)."],["Dred Scott v. Sandford (1857)","Black Americans can't be citizens by soil, blood or naturalization; overturned by the 14th Amendment."],["Chy Lung v. Freeman (1876)","Admitting foreigners is a federal power; California's bond law struck down."],["Chae Chan Ping v. U.S. (1889)","Exclusion is part of sovereignty; Congress may override treaties; plenary power."],["Wong Kim Ark (1898)","Born in the U.S. to Chinese parents = citizen (14th Amendment)."],["Ozawa (1922) · Thind (1923)","Japanese and Asian Indians not “white,” so “ineligible for citizenship.”"],["Korematsu (1944)","Upheld wartime exclusion of Japanese Americans; Murphy's dissent called it legalized racism."]]}},"plan":[{"day":"Two days out","tag":"Day 1","title":"Learn the list","date":"","blocks":[{"id":"q1","kind":"study","time":"Block 1","min":25,"what":"<b>Diagnostic 14.<\/b> Quick checks across every week; rate your confidence.","go":"diag"},{"id":"q2","kind":"study","time":"Block 2","min":50,"what":"<b>Weeks 2–4.<\/b> Read the notes, then write the IDs for words, the early republic and the antebellum era.","go":"mod:frames,early,ante"},{"id":"q3","kind":"study","time":"Block 3","min":50,"what":"<b>Weeks 5–7.<\/b> Notes, then IDs for labor, exclusion, the new immigration and quotas.","go":"mod:labor,excl,newimm,quotas"},{"id":"q4","kind":"other","time":"Night","min":0,"what":"Bed by midnight. Sleep is when the day's practice gets stored.","go":null}]},{"day":"The day before","tag":"Day 2","title":"Test it, then fix it","date":"","blocks":[{"id":"q5","kind":"study","time":"Block 1","min":30,"what":"<b>Mixed 15<\/b>, then Redo misses.","go":"mixed"},{"id":"q6","kind":"study","time":"Block 2","min":75,"what":"<b>Mock Midterm<\/b>, timed: 12 IDs and an essay on paper.","go":"mock"},{"id":"q7","kind":"study","time":"Block 3","min":30,"what":"Grade it with the key points; drill every ID you missed.","go":"twin"},{"id":"q8","kind":"other","time":"Night","min":0,"what":"Key dates and Readings cards once, then bed.","go":null}]},{"day":"Exam morning","tag":"Exam day","title":"Warm up, don't cram","date":"","blocks":[{"id":"q9","kind":"study","time":"Morning","min":30,"what":"<b>Warm-up 10<\/b>, then two essay outlines. No new material.","go":"warm"}]}],"diag":null,"evidence":[["Write it from memory, then check","Retrieval practice with answer checking beats rereading: g = 0.73 with feedback vs. 0.39 without (Rowland 2014, meta-analysis).","Every ID asks you to write first, then check the key points."],["Mix the eras","Interleaving helps you tell look-alike items apart (g ≈ 0.42; Brunmair &amp; Richter 2019).","Mixed sets and the ID drill shuffle weeks: Miln vs. Chy Lung, Page vs. Foran."],["Ask “why does it matter?”","Explaining why and how (self-explanation, elaborative interrogation) rates “moderate utility” and beats rereading (Dunlosky et al. 2013).","Every ID ends with significance and a connection."],["Spread it out","Spaced practice beats massed practice (Cepeda et al. 2008).","The route revisits every week on more than one day."],["Confident errors are gold","Mistakes made with high confidence are the most likely to be corrected after feedback (hypercorrection; Butterfield &amp; Metcalfe 2001).","Rate your confidence; confident misses get a star in the Error log."],["Sleep beats an all-nighter","In an MIT course, sleep over the weeks before tests predicted scores, and late bedtimes hurt (Okano et al. 2019); one night without sleep weakens new memories (Yoo et al. 2007).","The wind-down nudge tells you when to stop."]],"dayof":{"during":["Budget time: about 3–4 minutes per ID, then 25–30 minutes for the essay. Outline the essay first so it's safe.","For each ID: define it, place it (when, who), tie it to a reading by author, say why it matters, connect it to another term.","Use specifics: “the Page Act (1875)” earns more than “a law in the 1870s.”","If you blank, write what you know about the era and the closest related term; partial credit beats an empty box.","Essay: thesis in the first paragraph, three sections with keywords and authors, one complication, and a “so what” conclusion.","Save 3 minutes to reread: dates, names and whether you answered “significance.”"],"night":["If it's late, sleep. Recall depends on sleep more than on one more pass.","Otherwise: Key dates and Readings cards once, then bed at your usual time.","Pack pens; no devices in class."],"calc":[],"format":"<p>About 12 identifications from the posted list (a few sentences each), plus one longer essay on a broad theme tied to the keywords. In class, 75 minutes. Lecture notes from Oct 8 mention 8 IDs and 2 essays; check which applies on the day.<\/p>"},"resources":[["Vanderbilt Writing Studio","Free help planning and outlining essays.","https://www.vanderbilt.edu/writing/"]],"forecast":{"blueprint":[["Format","About 12 identifications drawn from the posted 45-term list (a few sentences each: definition, historical context, the reading where it matters) plus one longer essay on a broad theme tied to the keywords."],["Course guidance","Define each term and its implications; be ready to write 5–7 points per term; connect concepts; outline essays."]],"shifts":[["Define + implications","Lecture: “define term + implications”; be able to write 5–7 bullets on each word.","Use the five-part formula: define, place, reading, significance, connection."],["Relationships between concepts","Lecture: contextualize concepts and embed details in the broader historical structure.","Use the “Don't mix these up” lists and the pair questions."],["Essays reward detail and an outline","Lecture: “more detail the better”; outline as you write.","Outline first: thesis, three sections, keywords with dates, authors."],["No surprises","IDs come function lewis(spec){
  const U = 46, pad = 30;

  const X = a => (a.x - minx) * U + pad + bx, Y = a => (maxy - a.y) * U + pad;
  W += bx * 2 + (spec.ch ? 14 : 0);
  const norm = d => ((d % 360) + 360) % 360;
  const dist = (p, q) => { const d = Math.abs(norm(p) - norm(q)); return Math.min(d, 360 - d); };
  const rx = a => a.el === "" ? 0 : 4 + 5.2 * a.el.replace(/\d/g, "").length + 2 * (a.el.match(/\d/g) || []).length;
  const ry = a => a.el === "" ? 0 : 10;
  const trim = (a, deg) => { const r1 = rx(a), r2 = ry(a); if (!r1) return 0; const t = deg * Math.PI / 180; return 1 / Math.sqrt((Math.cos(t) / r1) ** 2 + (Math.sin(t) / r2) ** 2); };
  let out = "";
  spec.b.forEach(([i, j, o]) => {
    const a = A[i], b = A[j];
    const ang = Math.atan2(b.y - a.y, b.x - a.x);
    const deg = ang * 180 / Math.PI;
    const t1 = trim(a, deg) + (a.el ? 2 : 0), t2 = trim(b, deg + 180) + (b.el ? 2 : 0);
    const x1 = X(a) + Math.cos(ang) * t1, y1 = Y(a) - Math.sin(ang) * t1;
    const x2 = X(b) - Math.cos(ang) * t2, y2 = Y(b) + Math.sin(ang) * t2;
    const nx = Math.sin(ang), ny = Math.cos(ang);
    const ln = (off, cls) => `<line ${cls ? `class="${cls}"` : ""} x1="${(x1 + nx * off).toFixed(1)}" y1="${(y1 + ny * off).toFixed(1)}" x2="${(x2 + nx * off).toFixed(1)}" y2="${(y2 + ny * off).toFixed(1)}"/>`;
    if (o === 1) out += ln(0);
    else if (o === 2) out += ln(-3.2) + ln(3.2);
    else if (o === 3) out += ln(-4.8) + ln(0) + ln(4.8);
    else out += ln(-2.6) + ln(2.6, "dash");
  });
  A.forEach(a => {
    if (a.el) {
      const parts = a.el.match(/[A-Za-z]+|\d+/g) || [];
      let tx = "";
      parts.forEach(p => { tx += /\d/.test(p) ? `<tspan font-size="11" dy="4">${p}</tspan><tspan dy="-4"></tspan>` : `<tspan>${p}</tspan>`; });
      out += `<text x="${X(a).toFixed(1)}" y="${(Y(a) + 0.5).toFixed(1)}" text-anchor="middle" dominant-baseline="central">${tx}</text>`;
    }
    let lps = [];
    if (Array.isArray(a.lp)) lps = a.lp.slice();
    else if (a.lp > 0) {
      const n = a.lp;
      if (a.bonds.length === 1) {
        const o = a.bonds[0] + 180;
        lps = n === 1 ? [o] : n === 2 ? [o - 60, o + 60] : n === 3 ? [o, o - 90, o + 90] : [o, o - 90, o + 90, o + 180];
      } else if (a.bonds.length === 0) lps = [90, 270, 0, 180].slice(0, n);
      else {
        const taken = a.bonds.slice();
        for (let k = 0; k < n; k++) {
          let best = 0, bd = -1;
          for (let c = 0; c < 360; c += 15) {
            const md = Math.min(...taken.map(t => dist(t, c)));
            const bonus = c % 90 === 0 ? 0.6 : c % 45 === 0 ? 0.3 : 0;
            if (md + bonus > bd) { bd = md + bonus; best = c; }
          }
          taken.push(best); lps.push(best);
        }
      }
    }
    lps.forEach(d => {
      const t = d * Math.PI / 180, r = (a.el ? trim(a, d) : 0) + 5.5;
      const cx = X(a) + Math.cos(t) * r, cy = Y(a) - Math.sin(t) * r;
      const px = Math.sin(t) * 3.4, py = Math.cos(t) * 3.4;
      out += `<circle cx="${(cx + px).toFixed(1)}" cy="${(cy + py).toFixed(1)}" r="2.1"/><circle cx="${(cx - px).toFixed(1)}" cy="${(cy - py).toFixed(1)}" r="2.1"/>`;
    });
    if (a.fc && a.fc !== 0) {
      const txt = typeof a.fc === "number" ? (a.fc > 0 ? (a.fc === 1 ? "+" : a.fc + "+") : (a.fc === -1 ? "−" : (-a.fc) + "−")) : a.fc;
      const occ = a.bonds.concat(lps);
      let best = 45, bd = -1;
      [45, 135, 315, 225, 90, 0, 180, 270].forEach(c => { const md = occ.length ? Math.min(...occ.map(t => dist(t, c))) : 180; if (md > bd + 1) { bd = md; best = c; } });
      const t = best * Math.PI / 180, r = trim(a, best) + (String(txt).length > 1 ? 15 : 11);
      const fx = (X(a) + Math.cos(t) * r).toFixed(1), fy = (Y(a) - Math.sin(t) * r).toFixed(1);
      if (String(txt).length === 1) out += `<circle class="fcr" cx="${fx}" cy="${fy}" r="6.4"/>`;
      out += `<text class="fc" x="${fx}" y="${fy}" text-anchor="middle" dominant-baseline="central">${txt}</text>`;
    }
  });
  if (spec.ch) {
    const l = 8, r = W - 22, tp = 8, bt = H - 8;
    out += `<path d="M${l + 6} ${tp} H${l} V${bt} H${l + 6}"/><path d="M${r - 6} ${tp} H${r} V${bt} H${r - 6}"/>`;
    out += `<text class="ch" x="${r + 4}" y="${tp + 6}">${spec.ch}</text>`;
  }
  return `<svg class="lw" viewBox="0 0 ${W.toFixed(0)} ${H.toFixed(0)}" width="${W.toFixed(0)}" height="${H.toFixed(0)}" role="img" aria-label="structure">${out}</svg>`;
}

/* ------------------------------------------------------------------ numbers */
function sigfigs(m){
  let s = m.replace(/^[+-]/, "");
  if (s.includes(".")) { s = s.replace(".", "").replace(/^0+/, ""); const n = Math.max(s.length, 1); return {min: n, max: n}; }
  s = s.replace(/^0+/, "");
  return {min: Math.max(s.replace(/0+$/, "").length, 1), max: Math.max(s.length, 1)};
}
function parseNum(raw){
  let s = String(raw).trim().replace(/[\s,]/g, "").replace(/[−–]/g, "-").replace(/[×*·]/g, "x").replace(/X/g, "x");
  if (!s) return null;
  let m = s.match(/^([+-]?\d+(?:\.\d+)?)\/(\d+(?:\.\d+)?)$/);
  if (m) return {v: parseFloat(m[1]) / parseFloat(m[2]), sf: null};
  m = s.match(/^([+-]?(?:\d+\.?\d*|\.\d+))x10\^?\(?([+-]?\d+)\)?$/i);
  if (m) return {v: parseFloat(m[1]) * Math.pow(10, parseInt(m[2])), sf: sigfigs(m[1])};
  m = s.match(/^([+-]?(?:\d+\.?\d*|\.\d+))e([+-]?\d+)$/i);
  if (m) return {v: parseFloat(m[1] + "e" + m[2]), sf: sigfigs(m[1])};
  m = s.match(/^[+-]?(?:\d+\.?\d*|\.\d+)$/);
  if (m) return {v: parseFloat(s), sf: sigfigs(s)};
  return null;
}
function checkNum(q, raw){
  const p = parseNum(raw);
  if (!p) return {bad: true};
  const tol = q.tol || 0;
  const okv = tol === 0 ? Math.abs(p.v - q.ans) < 1e-9 * Math.max(1, Math.abs(q.ans)) : Math.abs(p.v - q.ans) <= tol * Math.abs(q.ans) + 1e-300;
  const sfok = !q.sf || p.sf === null || (q.sf >= p.sf.min && q.sf <= p.sf.max);
  const sfs = p.sf ? (p.sf.min === p.sf.max ? String(p.sf.min) : p.sf.min + "–" + p.sf.max) : "";
  return {okv, sfok, ok: okv && sfok, sf: sfs};
}
function fmtAns(q){
  if (q.kind !== "num") return "";
  const a = q.ans;
  if (Number.isInteger(a) && (q.tol === 0 || Math.abs(a) < 1e4)) return String(a);
  const ab = Math.abs(a);
  const sf = q.sf || 3;
  if (ab !== 0 && (ab < 0.01 || ab >= 10000)) { const [m, e] = a.toExponential(sf - 1).split("e"); return `${m.replace("-", "−")} × 10<sup>${e.replace("+", "").replace("-", "−")}</sup>`; }
  return (+a.toPrecision(sf)).toString().replace("-", "−");
}
