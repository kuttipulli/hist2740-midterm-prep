<!doctype html>
<html lang="en">
<head>
<title>HIST 2740 Midterm Prep</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="HIST 2740 midterm prep: all 45 identifications with key points, quick checks, essay outlines, a timed mock, flashcards and an error log.">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20viewBox%3D%270%200%2032%2032%27%3E%3Crect%20width%3D%2732%27%20height%3D%2732%27%20rx%3D%276%27%20fill%3D%27%2313202D%27/%3E%3Crect%20x%3D%275%27%20y%3D%2715%27%20width%3D%2722%27%20height%3D%272%27%20fill%3D%27%23D3DCE3%27/%3E%3Crect%20x%3D%278%27%20y%3D%279%27%20width%3D%272%27%20height%3D%2714%27%20fill%3D%27%237FA7D9%27/%3E%3Crect%20x%3D%2715%27%20y%3D%279%27%20width%3D%272%27%20height%3D%2714%27%20fill%3D%27%23E3B55B%27/%3E%3Crect%20x%3D%2722%27%20y%3D%279%27%20width%3D%272%27%20height%3D%2714%27%20fill%3D%27%23E2675C%27/%3E%3C/svg%3E">

</head>
<body>
<title>HIST 2740 Midterm Prep</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:ital,wght@0,400..700;1,400&family=Courier+Prime:wght@400;700&family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* THEME "Manifest" (HIST 2740 · Immigration in U.S. History).
   Layout: dark ledger-blue header with a timeline of the exam's laws and cases (1776–1945), sticky tab rail with the focus-session bar,
   then one working column of at most 880px.
   Palette from the paperwork of migration: ledger-green paper, customs-blue ink for anything you can act on, stamp red for misses,
   archival green for right answers. Libre Caslon for headings (Caslon set early American print such as Common Sense);
   Atkinson Hyperlegible Next for reading and typing; Courier Prime for labels, dates and timers, like typed passenger manifests. */
:root{
  color-scheme:light;
  --bg:#EDF0EE; --surface:#FBFCFB; --surface-2:#E2E7E4; --ink:#16212B; --muted:#4D5A65; --rule:#CBD4D0;
  --accent:#245A8C; --accent-ink:#FFFFFF; --accent-soft:#E0EAF4;
  --good:#2C6B4C; --good-soft:#DCEEE4; --bad:#A3322C; --bad-soft:#F6E1DF; --warn:#7C5600; --warn-soft:#F2E8CF;
  --strip:#13202D; --strip-ink:#D3DCE3; --strip-dim:#8B9AA8; --strip-hi:#F6F8FA;
  --h410:#7FA7D9; --h434:#5FBFA8; --h486:#E3B55B; --h656:#E2675C;
  --shadow:0 1px 2px rgb(22 33 43 / .05), 0 8px 20px -12px rgb(22 33 43 / .16);
  --display:"Libre Caslon Text", "Iowan Old Style", Georgia, serif;
  --body:"Atkinson Hyperlegible Next", "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"Courier Prime", "Courier New", ui-monospace, Menlo, monospace;
  --r:12px; --r-sm:8px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0E141A; --surface:#151D25; --surface-2:#1D2731; --ink:#E5EBEF; --muted:#9DABB6; --rule:#2B3743;
  --accent:#8DB8E6; --accent-ink:#0E141A; --accent-soft:#1D3148;
  --good:#72C79C; --good-soft:#12291E; --bad:#F1928A; --bad-soft:#3A1D1B; --warn:#E6BE68; --warn-soft:#33290F;
  --strip:#090E13; --strip-ink:#D3DCE3; --strip-dim:#7F8E9B; --strip-hi:#F6F8FA;
  --h410:#7FA7D9; --h434:#5FBFA8; --h486:#E3B55B; --h656:#E2675C;
  --shadow:0 0 0 1px rgb(0 0 0 / .15); color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0E141A; --surface:#151D25; --surface-2:#1D2731; --ink:#E5EBEF; --muted:#9DABB6; --rule:#2B3743;
  --accent:#8DB8E6; --accent-ink:#0E141A; --accent-soft:#1D3148;
  --good:#72C79C; --good-soft:#12291E; --bad:#F1928A; --bad-soft:#3A1D1B; --warn:#E6BE68; --warn-soft:#33290F;
  --strip:#090E13; --strip-ink:#D3DCE3; --strip-dim:#7F8E9B; --strip-hi:#F6F8FA;
  --h410:#7FA7D9; --h434:#5FBFA8; --h486:#E3B55B; --h656:#E2675C;
  --shadow:0 0 0 1px rgb(0 0 0 / .15); color-scheme:dark }

*{box-sizing:border-box}
html{background:var(--bg)}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
.wrap{max-width:880px;margin:0 auto;padding-inline:16px;padding-block:0 64px}
h1,h2,h3{font-family:var(--display);font-weight:600;line-height:1.12;text-wrap:balance;margin:0}
h2{font-size:clamp(1.75rem,4.8vw,2.2rem)}
h3{font-size:1.24rem}
h4{font-family:var(--mono);font-size:.74rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:1.2em 0 .45em;font-weight:600}
p{margin:.5em 0}
ul,ol{margin:.4em 0;padding-left:1.25em}
li{margin:.25em 0}
a{color:var(--accent);text-underline-offset:2px}
b,strong{font-weight:700}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px}
sub,sup{font-size:.72em;line-height:0}
.mono,.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:.87rem}

/* header readout */
.top{background:var(--strip);color:var(--strip-ink)}
.top .wrap{padding-block:20px 14px}
.toprow{display:flex;flex-wrap:wrap;gap:10px 20px;align-items:flex-end;justify-content:space-between}
.eyebrow{font-family:var(--mono);font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--strip-dim)}
.top h1{font-size:clamp(2.2rem,7.5vw,3.1rem);color:var(--strip-hi);font-weight:600;letter-spacing:-.01em;line-height:1.02;margin-top:4px}
.count{font-family:var(--mono);text-align:right;font-variant-numeric:tabular-nums}
.count b{display:block;font-size:1.3rem;color:var(--strip-hi);font-weight:500}
.count span{font-size:.72rem;color:var(--strip-dim);letter-spacing:.08em;text-transform:uppercase}
.strip{margin:16px 0 0}
.strip svg{display:block;width:100%;height:auto;overflow:visible}
.strip text{font-family:var(--mono)}
.strip .lbl{font-size:10px;fill:var(--strip-ink);font-weight:500}
.strip .scap{font-size:8.5px;fill:var(--strip-dim);letter-spacing:.06em}
.strip .tr{font-size:9px;fill:var(--strip-ink);opacity:.8}
.strip .sc{font-size:8.5px;fill:var(--strip-dim)}
.strip .narrow{display:none}
@media (max-width:560px){
  .strip .wide{display:none} .strip .narrow{display:inline}
  .strip .lbl{font-size:19px} .strip .tr{font-size:17px} .strip .sc{font-size:17px}
}
.statline{display:flex;flex-wrap:wrap;gap:4px 18px;font-family:var(--mono);font-size:.76rem;color:var(--strip-dim);margin-top:12px}
.statline b{color:var(--strip-ink);font-weight:500}
.sync{margin-left:auto}

/* tabs + focus bar */
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--bg);border-bottom:1px solid var(--rule)}
.tabs .wrap{padding-block:0}
.tabrow{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabrow::-webkit-scrollbar{display:none}
@media (max-width:720px){ .tabrow{-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 28px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 28px),transparent)} }
.tab{position:relative;background:none;border:0;padding:13px 12px 12px;font-size:.95rem;color:var(--muted);white-space:nowrap;font-weight:500}
.tab:hover{color:var(--ink)}
.tab:focus-visible{outline-offset:-4px}
.tab[aria-selected="true"]{color:var(--ink);font-weight:700}
.tab[aria-selected="true"]::after{content:"";position:absolute;left:10px;right:10px;bottom:0;height:3px;border-radius:3px 3px 0 0;background:var(--accent)}
.tab .badge{display:inline-block;min-width:20px;padding:0 6px;margin-left:6px;border-radius:9px;background:var(--surface-2);color:var(--muted);font-family:var(--mono);font-size:.72rem;font-weight:500;text-align:center}
.fbar{border-top:1px solid var(--rule);background:var(--surface)}
.tabs .frow{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;padding-block:7px;font-size:.9rem}
.fph{font-family:var(--mono);font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.ftime{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:1.02rem;font-weight:600}
.fgoal{flex:1 1 0;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted)}
.fmsg{flex:1 1 230px;min-width:0}
.fprog{height:3px;background:var(--surface-2)}
.fprog i{display:block;height:100%;background:var(--accent)}
.ph-break .fph,.ph-review .fph{background:var(--good-soft);color:var(--good)}
.ph-break .fprog i,.ph-review .fprog i{background:var(--good)}
.ph-over .fph{background:var(--warn-soft);color:var(--warn)}
.ph-over .fprog i{background:var(--warn)}
html.focusing .top,html.focusing .tabrow{display:none}
html.focusing .tabs:not(.has-f){display:none}
html.focusing .fbar{border-top:0}

section.panel{padding-top:24px}
.lede{color:var(--muted);max-width:64ch}
.stack{display:flex;flex-direction:column;gap:16px}
.card{background:var(--surface);border:1px solid var(--rule);border-radius:var(--r);padding:18px 20px;min-width:0;box-shadow:var(--shadow)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;border:1px solid var(--rule);background:var(--surface);color:var(--ink);border-radius:var(--r-sm);padding:8px 15px;font-size:.93rem;font-weight:600;line-height:1.2;text-align:center}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{color:var(--accent-ink);filter:brightness(1.1)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--ink);border-color:var(--rule)}
.btn.small{min-height:34px;padding:5px 11px;font-size:.86rem}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btnrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:5px;min-height:34px;border:1px solid var(--rule);border-radius:999px;padding:5px 13px;font-size:.88rem;background:var(--surface);color:var(--ink);text-align:left}
.chip:hover{border-color:var(--accent)}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--ink);font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.pill{display:inline-block;font-family:var(--mono);font-size:.7rem;letter-spacing:.04em;padding:1px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted);vertical-align:middle}
.pill.leak{background:var(--warn-soft);color:var(--warn)}
.pill.star{background:var(--warn-soft);color:var(--warn)}
.pill.lockp{background:var(--surface-2);color:var(--muted)}
kbd{font-family:var(--mono);font-size:.74rem;border:1px solid var(--rule);border-bottom-width:2px;border-radius:5px;padding:0 5px;background:var(--surface);color:var(--ink)}
.keys{font-size:.8rem;color:var(--muted)}
@media (hover:none){.keys{display:none}}
input.text{font:inherit;font-size:1rem;padding:9px 12px;border:1.5px solid var(--rule);border-radius:var(--r-sm);background:var(--surface);color:var(--ink);width:100%;min-width:0}
input.text:focus{border-color:var(--accent)}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:.88rem;font-weight:700}

/* mastery meters (shared by Learn, Practice, summaries) */
.meters{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));grid-auto-rows:1fr;gap:8px}
.meter{display:flex;flex-direction:column;gap:6px;border:1px solid var(--rule);background:var(--surface);border-radius:var(--r-sm);padding:9px 11px;text-align:left;color:var(--ink)}
.meter:hover{border-color:var(--accent)}
.meter[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.mrow{display:flex;align-items:center;justify-content:space-between;gap:8px}
.meter .mn{font-size:.9rem;font-weight:700}
.meter > .mrow:first-child{align-items:flex-start}
.meter .mt{margin-top:auto}
.mt{display:flex;height:6px;background:var(--surface-2);border-radius:3px;overflow:hidden}
.mt i{display:block;height:100%}
.mt i.ok{background:var(--good)}
.mt i.no{background:var(--bad);opacity:.5}
.ms{font-family:var(--mono);font-size:.7rem;color:var(--muted);font-variant-numeric:tabular-nums}
.lv{font-family:var(--mono);font-size:.62rem;letter-spacing:.08em;text-transform:uppercase;padding:1px 7px;border-radius:999px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.lv-solid{background:var(--good-soft);color:var(--good)}
.lv-learning{background:var(--accent-soft);color:var(--accent)}
.dots{display:inline-flex;gap:3px;align-items:center}
.dots i{width:7px;height:7px;border-radius:50%;border:1.5px solid var(--muted);opacity:.5}
.dots i.on{background:var(--accent);border-color:var(--accent);opacity:1}

/* route */
.next{display:grid;grid-template-columns:1fr auto;gap:12px 16px;align-items:center;background:var(--accent-soft);border:1px solid var(--accent);border-radius:var(--r);padding:15px 18px}
.next .lab{font-family:var(--mono);font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);font-weight:600}
.next .btnrow .go{margin-top:0}
.days{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:4px}
.day h3{font-size:1.15rem}
.day .dtag{font-family:var(--mono);font-size:.7rem;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.day .dtitle{color:var(--muted);font-size:.9rem;margin-bottom:8px}
.blk{display:grid;grid-template-columns:22px 1fr;gap:8px;padding:10px 0;border-top:1px solid var(--rule)}
.blk input{width:18px;height:18px;margin-top:3px;accent-color:var(--accent)}
.blk .bt{font-family:var(--mono);font-size:.74rem;color:var(--muted);font-variant-numeric:tabular-nums}
.blk.done .bw{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--rule)}
.blk .bw{font-size:.92rem}
.blk .go{margin-top:6px}
.blk.class .bw,.blk.other .bw{color:var(--muted);font-size:.87rem}
.blk.class .kmark{width:4px;height:100%;min-height:28px;margin-left:6px;border-radius:2px;background:var(--rule)}
.blk.other .kmark{width:4px;height:100%;min-height:20px;margin-left:6px;border-radius:2px;background:transparent;border-left:2px dotted var(--rule)}
.blk.now{background:var(--accent-soft);margin:0 -10px;padding:10px;border-radius:var(--r-sm)}
.evid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.evid .card h3{font-size:1.06rem;margin-bottom:6px}
.evid .how{font-size:.86rem;color:var(--accent);margin-top:8px;font-weight:600}
.res a{font-weight:600}

/* diagnosis */
.dgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.score{font-family:var(--display);font-size:2.5rem;line-height:1;font-weight:600}
.score small{font-size:1rem;color:var(--muted);font-family:var(--body);font-weight:400}
.bars{display:flex;flex-direction:column;gap:9px;margin-top:12px}
.bar .bl{display:flex;justify-content:space-between;gap:8px;font-size:.87rem}
.bar .bl span:last-child{font-family:var(--mono);color:var(--muted);white-space:nowrap}
.bar .track{height:8px;background:var(--surface-2);border-radius:4px;overflow:hidden;margin-top:3px}
.bar .fill{height:100%;border-radius:4px;background:var(--bad)}
.bar .fill.c1,.bar .fill.light{background:var(--h656)}
.bar .fill.c2,.bar .fill.naming{background:var(--h434)}
.bar .fill.c3,.bar .fill.polarity{background:var(--h486)}
.bar .fill.c4,.bar .fill.precision{background:var(--warn)}
.leak{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:start}
.leak .k{font-family:var(--display);font-size:1.8rem;color:var(--accent);line-height:1;font-weight:600}

/* learn */
.notes h3{margin-top:2px;font-size:1.4rem}
.notes .obj{font-family:var(--mono);font-size:.76rem;color:var(--muted);margin-top:6px}
.notes .why:empty{display:none}
.notes .why{background:var(--surface-2);border-radius:var(--r-sm);padding:10px 13px;margin:12px 0;font-size:.93rem}
.notes table.mini,.sol table.mini{border-collapse:collapse;font-size:.9rem;margin:8px 0;min-width:0}
table.mini th,table.mini td{border-bottom:1px solid var(--rule);padding:6px 12px 6px 0;text-align:left;vertical-align:top}
table.mini th{font-weight:700;color:var(--muted);font-size:.74rem;text-transform:uppercase;letter-spacing:.06em;font-family:var(--mono)}
.tablewrap{overflow-x:auto}
.eq{font-family:var(--mono);background:var(--surface-2);border-radius:8px;padding:8px 12px;margin:6px 0;font-size:.92rem;overflow-x:auto}
.callout{background:var(--accent-soft);padding:10px 14px;border-radius:var(--r-sm);margin:10px 0;font-size:.94rem}
.chain{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chain span{font-family:var(--mono);font-size:.86rem;background:var(--surface-2);border-radius:6px;padding:5px 9px;position:relative}
.chain span:not(:last-child)::after{content:"→";position:absolute;right:-12px;color:var(--muted)}
.chain span:not(:last-child){margin-right:10px}
.worked{border:1px dashed var(--rule);border-radius:var(--r-sm);padding:11px 15px;margin-top:12px}
.traps li::marker{color:var(--bad)}
.fggal{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,360px),1fr));gap:10px;margin:6px 0 16px}
.fgc{display:flex;flex-direction:column;gap:6px;border:1px solid var(--rule);border-radius:var(--r-sm);padding:11px 13px;background:var(--surface);min-width:0}
.fgc.wide{grid-column:1/-1}
.fgc > b{font-size:.98rem}
.fgd{display:flex;flex-wrap:wrap;align-items:flex-start;gap:8px 18px}
.fgd .lw{zoom:.85}
.fgf{display:flex;flex-direction:column;gap:2px;min-width:0;max-width:100%}
.fgl{font-family:var(--mono);font-size:.64rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.fgn{font-size:.88rem;margin-top:auto}
.fgx{font-family:var(--mono);font-size:.74rem;color:var(--muted)}
.figrow{display:flex;flex-wrap:wrap;gap:14px;align-items:center;margin:10px 0}
.cap{font-size:.85rem;color:var(--muted);margin-top:-4px}

/* keyword list: <ul class="kwl"><li><b>term</b> gloss<span class="km">date · source</span></li></ul> */
.kwl{list-style:none;padding:0;margin:10px 0}
.kwl li{margin:0;padding:10px 0;border-top:1px solid var(--rule)}
.kwl li:last-child{border-bottom:1px solid var(--rule)}
.kwl .km{display:block;font-family:var(--mono);font-size:.76rem;color:var(--muted);margin-top:2px}
/* lewis svg */
.lw{display:inline-block;vertical-align:middle;max-width:100%;height:auto}
.lw line{stroke:var(--ink);stroke-width:1.7;stroke-linecap:round}
.lw line.dash{stroke-dasharray:3 3}
.lw text{fill:var(--ink);font-family:var(--body);font-size:16px;font-weight:600}
.lw text.fc{fill:var(--accent);font-size:11.5px;font-weight:700}
.lw text.ch{font-size:13px;font-weight:700}
.lw circle{fill:var(--ink)}
.lw circle.fcr{fill:none;stroke:var(--accent);stroke-width:1.1}
.lw path{stroke:var(--ink);stroke-width:1.5;fill:none}
.fig{display:block;width:100%;max-width:520px;height:auto}
.fig .fcurve{fill:none;stroke:var(--accent);stroke-width:2}
.fig .faxis{stroke:var(--muted);stroke-width:1}
.fig .fnode{fill:var(--bad)}
.fig .flab{fill:var(--ink);font-family:var(--mono);font-size:14px;font-weight:600}
.fig .flab.small{font-size:11px;font-weight:400;fill:var(--muted)}
.fig .fmark{fill:var(--ink);font-family:var(--mono);font-size:13px;font-weight:600}
.pairlab{font-family:var(--mono);font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-top:14px;font-weight:600}
.lock{border:1px dashed var(--warn);background:var(--warn-soft);border-radius:var(--r);padding:14px 16px}
.fc-table{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr) minmax(0,1fr);gap:8px 14px;font-size:.9rem}
.fc-table .h{font-family:var(--mono);font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
@media (max-width:720px){.fc-table{grid-template-columns:1fr}.fc-table .h{display:none}.fc-table b{display:block;margin-top:8px}}

/* practice: focus session, sets, questions */
.fhead{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:4px 12px}
.cycle{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;counter-reset:c}
.cycle li{margin:0;background:var(--surface-2);border-radius:var(--r-sm);padding:8px 11px;counter-increment:c;line-height:1.3}
.cycle li::before{content:counter(c);display:block;font-family:var(--mono);font-size:.68rem;color:var(--muted)}
.cycle b{display:block;font-size:.92rem}
.cycle span{color:var(--muted);font-family:var(--mono);font-size:.74rem}
.fset{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px}
.night{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px;align-items:start}
.moon{width:26px;height:26px;border-radius:50%;box-shadow:inset 8px -4px 0 0 var(--warn);margin-top:2px}
.nightline{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;font-size:.9rem;padding:8px 12px;border-radius:var(--r-sm);background:var(--warn-soft);margin-bottom:12px}
.nightline span{flex:1 1 220px;min-width:0}
.stopped{background:var(--accent-soft);border-color:var(--accent)}
.grp h4{margin-top:0}
.modes{display:flex;flex-wrap:wrap;gap:8px}
.mode{display:flex;flex-direction:column;gap:2px;border:1px solid var(--rule);background:var(--surface);border-radius:12px;padding:11px 13px;text-align:left;min-width:0;flex:1 1 150px;color:var(--ink)}
.mode:hover:not([disabled]){border-color:var(--accent)}
.mode b{font-size:.96rem}
.mode span{font-size:.82rem;color:var(--muted)}
.mode .est{font-family:var(--mono);font-size:.7rem;letter-spacing:.02em;margin-top:auto;padding-top:4px;white-space:nowrap}
.mode[disabled]{opacity:.5;cursor:not-allowed}
.mode[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.qhead{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:.8rem;color:var(--muted);font-family:var(--mono)}
.qhead .btn{font-family:var(--body)}
.qhead .qtools{margin-left:auto;display:flex;gap:4px;flex-wrap:wrap}
a.btn{text-decoration:none}
.qprog{height:4px;background:var(--surface-2);border-radius:2px;margin:10px 0 16px;overflow:hidden}
.qprog i{display:block;height:100%;background:var(--accent);border-radius:2px}
.stem{font-size:1.06rem;line-height:1.6;max-width:68ch}
.choices{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.choice{display:grid;grid-template-columns:30px minmax(0,1fr);gap:10px;align-items:center;text-align:left;border:1.5px solid var(--rule);border-radius:12px;padding:10px 14px;background:var(--surface);min-height:50px;color:var(--ink)}
.choice:hover:not([disabled]){border-color:var(--accent)}
.choice[disabled]{cursor:default}
.choice .lt{font-family:var(--mono);font-size:.84rem;font-weight:600;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);color:var(--muted)}
.choice[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.choice[aria-pressed="true"] .lt{background:var(--accent);color:var(--accent-ink)}
.choice.right{border-color:var(--good);background:var(--good-soft)}
.choice.right .lt{background:var(--good);color:var(--surface)}
.choice.wrong{border-color:var(--bad);background:var(--bad-soft)}
.choice.wrong .lt{background:var(--bad);color:var(--surface)}
.choice svg{max-height:110px}
.numin{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:14px}
.numin input{font-family:var(--mono);font-size:1.05rem;padding:9px 12px;border:1.5px solid var(--rule);border-radius:var(--r-sm);background:var(--surface);color:var(--ink);width:min(280px,100%)}
.numin input:focus{border-color:var(--accent)}
.numin .unit{font-family:var(--mono);color:var(--muted)}
.hint{font-size:.8rem;color:var(--muted);margin-top:6px}
.conf{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:16px;font-size:.86rem}
.verdict{display:flex;flex-direction:column;gap:2px;border-radius:12px;padding:11px 14px;margin-top:16px;border:1px solid transparent}
.verdict b{font-size:1rem}
.verdict .vnote{font-size:.88rem;color:var(--muted)}
.verdict.ok{background:var(--good-soft);border-color:var(--good)}
.verdict.ok b{color:var(--good)}
.verdict.no{background:var(--bad-soft);border-color:var(--bad)}
.verdict.no b{color:var(--bad)}
.verdict.sf{background:var(--warn-soft);border-color:var(--warn)}
.verdict.sf b{color:var(--warn)}
.mline{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin-top:10px;font-family:var(--mono);font-size:.78rem;color:var(--muted)}
.mline .mt{flex:0 1 150px;min-width:80px}
.sol{margin-top:12px;font-size:.96rem}
details.solwrap{margin-top:12px}
details.solwrap summary{cursor:pointer;font-weight:700;font-size:.9rem;color:var(--accent)}
.trap{margin-top:10px;font-size:.9rem;padding:9px 13px;background:var(--bad-soft);border-radius:var(--r-sm)}
.trap .tl{font-family:var(--mono);font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:var(--bad);font-weight:600;display:block}
.why{margin-top:14px}
.why .chips{margin-top:6px}
.askbox{margin-top:10px;white-space:pre-wrap;font-size:.93rem;background:var(--surface-2);border-radius:var(--r-sm);padding:10px 12px}
.ask{display:none}
.has-ask .ask{display:inline-flex}
.rubric label{display:flex;gap:8px;align-items:flex-start;font-size:.92rem;margin:4px 0}
.summary .big{font-family:var(--display);font-size:2.6rem;line-height:1;font-weight:600}
.sumtab td{vertical-align:middle}
.sumtab .mt{width:110px}
.breakp .bigt{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:clamp(3rem,13vw,4.4rem);line-height:1;font-weight:500;color:var(--good)}
.revlist details{border-top:1px solid var(--rule);padding:9px 0}
.revlist summary{cursor:pointer;font-size:.92rem}
.steps{margin:0;padding-left:1.3em}

/* mock */
.mockbar{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--navh,47px));z-index:4;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;background:var(--surface);border:1px solid var(--rule);border-radius:var(--r);padding:8px 12px;box-shadow:var(--shadow)}
.timer{font-family:var(--mono);font-size:1.25rem;font-variant-numeric:tabular-nums;font-weight:600}
.timer.low{color:var(--warn)}
.qnav{display:flex;flex-wrap:wrap;gap:4px}
.qnav button{font-family:var(--mono);font-size:.72rem;min-width:30px;min-height:28px;padding:3px 5px;border:1px solid var(--rule);background:var(--surface);border-radius:6px}
.qnav button.ans{background:var(--accent-soft);border-color:var(--accent)}
.qnav button.cur{outline:2px solid var(--accent)}
.sec{font-family:var(--mono);font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:16px 0 6px}
.mres{display:grid;grid-template-columns:auto 1fr auto;gap:6px 12px;align-items:start;font-size:.9rem}
.mres .pts{font-family:var(--mono);white-space:nowrap}
.confirm{background:var(--warn-soft);border:1px solid var(--warn);border-radius:var(--r-sm);padding:10px 12px}

/* cards */
.flash{min-height:200px;display:grid;place-items:center;text-align:center;cursor:pointer;user-select:none;padding:28px}
.flash .side{font-family:var(--mono);font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.flash .face{font-family:var(--body);font-size:1.6rem;font-weight:700;line-height:1.3}
.flash.back .face{font-size:1.25rem;font-weight:500}

/* log */
.logrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:start;padding:12px 0;border-top:1px solid var(--rule)}
.logrow:first-child{border-top:0;padding-top:0}
.logrow .lq{font-size:.93rem}
.logrow .lm{font-family:var(--mono);font-size:.72rem;color:var(--muted);margin-top:4px}
.catsum{display:flex;flex-wrap:wrap;gap:6px}

/* exam day */
.cols2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.calc{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 12px;font-family:var(--mono);font-size:.86rem}
.calc button{font-family:var(--mono);font-size:.8rem;border:1px dashed var(--rule);background:transparent;border-radius:6px;padding:2px 8px;color:var(--muted)}

@media (max-width:720px){
  .days,.evid,.dgrid,.cols2{grid-template-columns:1fr}
  .count{text-align:left}
  .next{grid-template-columns:1fr}
  .mres{grid-template-columns:auto 1fr}
  .mres .pts{grid-column:2}
  .card{padding:16px}
}
@media (max-width:520px){ .cycle{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media (prefers-reduced-motion:no-preference){
  .btn,.chip,.choice,.tab,.meter,.mode{transition:border-color .15s ease,background-color .15s ease,color .15s ease}
  .flash{transition:transform .25s ease}
  .flash:active{transform:scale(.99)}
  .fprog i{transition:width 1s linear}
}

<script>
const DATA = {"bank":[{"id":"ID-nation","mod":"frames","kind":"self","diff":2,"tag":"twin","stem":"<b>Identify:<\/b> “nation of immigrants”<div class='hint'>On paper, in your own words: define · context · reading · significance · connection.<\/div>","model":"<span class='muted small'>Popularized 1930s–60s; JFK pamphlet 1958 · Gabaccia; Kennedy; Ellis (critique)<\/span><ul><li>Definition: the idea that the United States is essentially a nation made by immigrants and their descendants, so welcoming newcomers is part of who Americans are.<\/li><li>Popularized by John F. Kennedy's <i>A Nation of Immigrants<\/i> (1958, written for the Anti-Defamation League) as an argument against the national-origins quotas; the campaign ended in the 1965 Act.<\/li><li>Gabaccia: the phrase is newer than it sounds. 19th-century Americans talked about “emigrants,” and calling the whole country a “nation of immigrants” spread only in the 20th century.<\/li><li>Kennedy's version rests on contributionism: each group earns its place through what it gave.<\/li><li>Critique (Ellis): it leaves out Native nations, who were dispossessed rather than immigrants, and enslaved Africans, who were forced migrants.<\/li><li>Significance: the course's central tension, a language of welcome that has coexisted with exclusion, racial hierarchy, deportation and incarceration.<\/li><\/ul>","rubric":["Defined the term precisely","Placed it in time and named key people or institutions","Tied it to a specific reading and its author's argument","Explained its significance (what it changed, who gained or lost)","Connected it to at least one other keyword"]},{"id":"ID-contrib","mod":"frames","kind":"self","diff":2,"tag":"twin","stem":"<b>Identify:<\/b> contributionism<div class='hint'>On paper, in your own words: define · context · reading · significance · connection.<\/div>","model":"<span class='muted small'>Progressive era (Andrews, 1914); JFK, 1958 · Kennedy; Andrews (Opposing Viewpoints); lecture<\/span><ul><li>Definition: arguing for immigrants' acceptance on the grounds of what they contribute to the nation: labor, skills, culture, wealth, military service.<\/li><li>Classic example: JFK's <i>A Nation of Immigrants<\/i> catalogues each group's “contribution” to American life.<\/li><li>Earlier version: A. Piatt Andrews answered restrictionists like E. A. Ross by pointing to immigrants' work and successful assimilation.<\/li><li>Lecture: immigrants held up as exemplars of social mobility; their usefulness is what justifies their presence.<\/li><li>Limit: belonging becomes conditional on usefulness, and the story celebrates “successful” European groups while those judged unproductive stay outside.<\/li><li>Connect: “nation of immigrants”; later the “model minority” label works the same way.<\/li><\/ul>","rubric":["Defined the term precisely","Placed it in time and named key people or institutions","Tied it to a specific reading and its author's argument","Explained its significance (what it changed, who gained or lost)","Connected it to at least one other keyword"]},{"id":"ID-emig","mod":"frames","kind":"self","diff":2,"tag":"twin","stem":"<b>Identify:<\/b> emigrant vs. immigrant<div class='hint'>On paper, in your own words: define · context · reading · significance · connection.<\/div>","model":"<span class='muted small'>Usage shifts around the Civil War decades · Gabaccia; lecture; Núñez<\/span><ul><li>“Emigrant” names someone leaving a place (out); “immigrant” names someone entering one (in). Same person, seen from the sending or the receiving side.<\/li><li>Lecture: “emigrant” often sounded positive and adventurous; “immigrant” frames the person as an outsider crossing into “our” inside.<\/li><li>Gabaccia: Americans mostly called newcomers “emigrants” until around the Civil War, then switched to “immigrants,” a sign of a receiving nation defining itself against arrivals.<\/li><li>Early law spoke of “passengers” and “emigrants” (New York's Commissioners of Emigration, 1847): travelers or cargo, not future members.<\/li><li>Núñez: legal words (alien, immigrant, citizen) draw lines of belonging; “alien” marks a person as permanently other.<\/li><li>Significance: word choice tracks the rise of a state that claims the right to judge who comes in.<\/li><\/ul>","rubric":["Defined the term precisely","Placed it in time and named key people or institutions","Tied it to a specific reading and its author's argument","Explained its significance (what it changed, who gained or lost)","Connected it to at least one other keyword"]},{"id":"ID-border","mod":"frames","kind":"self","diff":2,"tag":"twin","stem":"<b>Identify:<\/b> “the border crossed us”<div class='hint'>On paper, in your own words: define · context · reading · significance · connection.<\/div>","model":"<span class='muted small'>Chicano and Native activism; rooted in 1848 · Ellis<\/span><ul><li>Slogan (“We didn't cross the border; the border crossed us”) associated with Chicano and Indigenous activism.<\/li><li>Context: after the U.S.–Mexican War, the Treaty of Guadalupe Hidalgo (1848) annexed half of Mexico; its residents became U.S. residents without moving.<\/li><li>Ellis, “The Border(s) Crossed Us Too”: U.S. borders and sovereignty were imposed on Indigenous land through settler colonialism, removal and dispossession.<\/li><li>It challenges the “nation of immigrants” story, which treats everyone as a newcomer and hides conquest.<\/li><li>Ellis argues immigrant-rights and Native-rights movements face the same settler state and border regime, and calls for solidarity.<\/li><li>Significance: borders are products of conquest, not natural lines; who counts as “foreign” depends on who drew them.<\/li><\/ul>","rubric":["Defined the term precisely","Placed it in time and named key people or institutions","Tied it to a specific reading and its author's argument","Explained its significance (what it changed, who gained or lost)","Connected it to at least one other keyword"]},{"id":"ID-sov","mod":"frames","kind":"self","diff":2,"tag":"twin","stem":"<b>Identify:<\/b> sovereignty<div class='hint'>On paper, in your own words: define · context · reading · significance · connection.<\/div>","model":"<span class='muted small'>From the founding; legal peak 1889 · Lecture; Ellis; Chae Chan Ping<\/span><ul><li>Definition: a state's supreme, exclusive authority over its territory and people, free of outside interference.<\/li><li>In immigration law, the power to admit, exclude and deport foreigners is treated as an inherent part of sovereignty rather than a power listed in the Constitution (Chae Chan Ping, 1889).<\/li><li>Lecture: sovereignty is the hidden engine of immigration politics; it grew out of European empire, which declared colonized land “terra nullius,” empty of legitimate claims.<\/li><li>Ellis: U.S. sovereignty was built on settler colonialism, turning Indigenous people into outsiders on their own land.<\/li><li>Federal vs. state: before the 1870s states exercised much of the power over entry; federalization moved it to the national government.<\/li><li>Lecture: race and gender shaped sovereignty talk (borders as masculine defense against “invasion”).<\/li><li>Leads to the plenary power doctrine: courts defer to Congress on immigration.<\/li><\/ul>","rubric":["Defined the term precisely","Placed it in time and named key people or institutions","Tied it to a specific reading and its author's argument","Explained its significance (what it changed, who gained or lost)","Connected it to at least one other keyword"]},{"id":"ID-ethno","mod":"frames","kind":"self","diff":2,"tag":"twin","stem":"<b>Identify:<\/b> ethnonationalism<div class='hint'>On paper, in your own words: define · context · reading · significance · connection.<\/div>","model":"<span class='muted small'>Recurring; in the U.S. from 1790 to 1924 and beyond · Lecture (Sep 8); Ngai; Know-Nothing texts<\/span><ul><li>Definition: the idea that a nation is defined by shared ethnicity (descent, race, religion, language) and that the state should represent and protect that group.<\/li><li>Lecture: the traditional idea of the nation as one people and one culture, an “ethnostate”; immigrants pluralize the people and unsettle that model.<\/li><li>Contrast: civic nationalism, where membership rests on shared political principles open to newcomers (Paine's “asylum for mankind”).<\/li><li>U.S. examples: the 1790 Act's “free white persons,” the Know-Nothings' “America for the Americans,” and the 1924 quotas built to freeze the nation's ethnic makeup.<\/li><li>Ngai: the 1924 Act wrote an ethnic and racial picture of “the American people” into law.<\/li><li>Significance: a recurring answer to “who are the American people?” that justifies exclusion.<\/li><\/ul>","rubric":["Defined the term precisely","Placed it in time and named key people or institutions","Tied it to a specific reading and its author's argument","Explained its significance (what it changed, who gained or lost)","Connected it to at least one other keyword"]},{"id":"ID-asylum","mod":"early","kind":"self","diff":2,"tag":"twin","stem":"<b>Identify:<\/b> “asylum for all mankind”<div class='hint'>On paper, in your own words: define · context · reading · significance · connection.<\/div>","model":"<span class='muted small'>January 1776 · Paine, <i>Common Sense<\/i><\/span><ul><li>From Thomas Paine's <i>Common Sense<\/i> (1776): America as an “asylum for the persecuted lovers of civil and religious liberty from every part of Europe,” and his call to “prepare in time an asylum for mankind.”<\/li><li>Context: the case for independence. Paine argued that Europe, not England, was America's parent country, tying the Revolution to welcoming refugees from monarchy.<\/li><li>Course definition: an early revolutionary ideal welcoming refugees, especially from republican, anti-monarchical struggles like America's own.<\/li><li>Limits: the welcome imagined was European and largely Protestant; by 1798 the Alien Friends Act let the president deport foreigners he judged dangerous, aimed at radicals.<\/li><li>Significance: an origin point for the “nation of immigrants” self-image and later refugee rhetoric, always in tension with fear of foreign radicals.<\/li><\/ul>","rubric":["Defined the term precisely","Placed it in time and named key people or institutions","Tied it to a specific reading and its author's argument","Explained its significance (what it changed, who gained or lost)","Connected it to at least one other keyword"]},{"id":"ID-nat1790","mod":"early","kind":"self","diff":2,"tag":"twin","stem":"<b>Identify:<\/b> Naturalization Act (1790)<div class='hint'>On paper, in your own words: define · context · reading · significance · connection.<\/div>","model":"<span class='muted small'>March 1790 · 1790 Act (primary); Zolberg; Ngai<\/span><ul><li>First federal naturalization law (1790): any alien who was a “free white person” of good character, with two years' residence, could become a citizen in any court.<\/li><li>Children born abroad to citizen fathers were citizens (jus sanguinis).<\/li><li>Made whiteness a legal condition of naturalization; this racial bar shaped membership until 1952 (Asians were barred until the 1940s–1952).<\/li><li>Residency rose to 5 years (1795) and 14 years (1798, Federalist fear of radical immigrants) before returning to 5 (1802).<\/li><li>Zolberg's “nation by design”: fast, cheap naturalization served a land-rich republic that wanted European settlers.<\/li><li>Connect: 1870 opened naturalization to people of African descent only; “aliens ineligible for citizenship” (1924) built on the racial bar.<\/li><\/ul>","rubric":["Defined the term precisely","Placed it in time and named key people or institutions","Tied it to a specific reading and its author's argument","Explained its significance (what it changed, who gained or lost)","Connected it to at least one other keyword"]},{"id":"ID-jus","mod":"early","kind":"self","diff":2,"tag":"twin","stem":"<b>Identify:<\/b> jus soli / jus sanguinis<div class='hint'>On paper, in your own words: define · context · reading · significance · connection.<\/div>","model":"<span class='muted small'>English common law; U.S. 1790 and 1868 · Parker; Zolberg; Núñez<\/span><ul><li>Jus soli (“right of the soil”): citizenship by birth on the state's territory. Jus sanguinis (“right of blood”): citizenship through a parent.<\/li><li>The U.S. inherited jus soli from English common law; the 1790 Act added jus sanguinis for children born abroad to citizen fathers.<\/li><li>Parker: Dred Scott v. Sandford (1857) said Black Americans could not be citizens by soil, by blood or by naturalization.<\/li><li>The Fourteenth Amendment (1868) put jus soli in the Constitution; Wong Kim Ark (1898) applied it to children of Chinese immigrants.<\/li><li>Many European states leaned on jus sanguinis, tying membership to descent; jus soli makes immigrants' children members in one generation.<\/li><li>Significance: the choice decides whether immigrants' children are insiders or permanent foreigners.<\/li><\/ul>","rubric":["Defined the term precisely","Placed it in time and named key people or institutions","Tied it to a specific reading and its author's argument","Explained its significance (what it changed, who gained or lost)","Connected it to at least one other keyword"]},{"id":"ID-passenger","mod":"early","kind":"self","diff":2,"tag":"twin","stem":"<b>Identify:<\/b> Passenger Acts (1803, 1819, 1847/48, 1855/1882)<div class='hint'>On paper, in your own words: define · context · reading · significance · connection.<\/div>","model":"<span class='muted small'>1803 (British); U.S. 1819 to 1882 · Zolberg; Neuman; Parker<\/span><ul><li>What they are: laws regulating ships that carried migrants (passengers per ton, space, food, ventilation, passenger lists). The course calls “passenger” an early category that treated migrants almost as cargo, overseen by customs collectors and the Treasury.<\/li><li>1803: a <i>British<\/i> Act of Parliament limiting passengers per ton, framed as humanitarian but meant to slow the emigration of workers (Zolberg).<\/li><li>1819: the first U.S. Passenger Act limited passengers by ship tonnage and required manifests for customs, the first federal count of arrivals.<\/li><li>1847–48: after the Irish famine crossings, Congress set space and ventilation rules; 1855 consolidated them (Zolberg calls it restriction's biggest national win to date); 1882 updated steerage rules.<\/li><li>Zolberg: raising the cost and standards of passage was “remote control,” attracting desirable Europeans while discouraging the poor.<\/li><li>Federal power came through regulating navigation: on board, migrants were federal “passengers”; once landed, they fell under state law.<\/li><li>Significance: federal immigration policy existed, indirectly, long before 1875.<\/li><\/ul>","rubric":["Defined the term precisely","Placed it in time and named key people or institutions","Tied it to a specific reading and its author's argument","Explained its significance (what it changed, who gained or lost)","Connected it to at least one other keyword"]},{"id":"ID-remote","mod":"early","kind":"self","diff":2,"tag":"twin","stem":"<b>Identify:<\/b> remote control / border externalization<div class='hint'>On paper, in your own words: define · context · reading · significance · connection.<\/div>","model":"<span class='muted small'>1819 onward; full form after WWI (1924 visas) · Zolberg; lecture (Oct 6)<\/span><ul><li>Zolberg's term for controlling migration before migrants reach U.S. territory: at ports of departure, on ships, through consuls abroad.<\/li><li>Early tools: Passenger Acts raising the cost of passage (1819); consular screening of Asian emigrants under the Page Act (1875).<\/li><li>Full form after WWI: the 1924 Act required visas from U.S. consuls abroad, so admission was decided at departure, not on arrival (lecture).<\/li><li>1930s: consuls used the public-charge (LPC) clause to deny visas to Jewish refugees, an example of control exercised far from the border.<\/li><li>Today “border externalization” means pushing enforcement outward: interdiction at sea, pressuring transit countries such as Mexico to stop migrants.<\/li><li>Significance: the border is not just a line; the state polices mobility far away from it, out of sight of courts and the public.<\/li><\/ul>","rubric":["Defined the term precisely","Placed it in time and named key people or institutions","Tied it to a specific reading and its author's argument","Explained its significance (what it changed, who gained or lost)","Connected it to at least one other keyword"]},{"id":"ID-pauper","mod":"early","kind":"self","diff":2,"tag":"twin","stem":"<b>Identify:<\/b> pauperism<div class='hint'>On paper, in your own words: define · context · reading · significance · connection.<\/div>","model":"<span class='muted small'>Colonial era to 1882 · Zolberg; Neuman; Parker; lecture<\/span><ul><li>Definition: dependence on public poor relief; “paupers” were treated as a moral and fiscal threat.<\/li><li>Colonial and state poor laws (bonds, head taxes, removal) were the main early tools of immigration control (Neuman, Zolberg).<\/li><li>Fear that Europe was dumping its poor: lecture describes the metropole sending unwanted people (paupers, convicts) to the colonial periphery.<\/li><li>Massachusetts and New York required bonds or fees for alien passengers; Massachusetts shipped Irish paupers back in the 1850s (Zolberg, Parker).<\/li><li>Miln (1837) upheld state power to guard against the “moral pestilence” of paupers.<\/li><li>Became federal law in 1882 (“public charge”), later the LPC clause.<\/li><li>Parker: poverty worked as a status that made people outsiders, like a form of foreignness.<\/li><\/ul>","rubric":["Defined the term precisely","Placed it in time and named key people or institutions","Tied it to a specific reading and its author's argument","Explained its significance (what it changed, who gained or lost)","Connected it to at least one other keyword"]},{"id":"ID-fedz","mod":"early","kind":"self","diff":2,"tag":"twin","stem":"<b>Identify:<\/b> federalization<div class='hint'>On paper, in your own words: define · context · reading · significance · connection.<\/div>","model":"<span class='muted small'>Mainly 1849–1891 · Neuman; Kenny; Parker; lecture<\/span><ul><li>Definition: the shift of authority over immigration from states and localities to the federal government, mainly in the 1870s–1890s (lecture).<\/li><li>Before: Neuman's “lost century” (1776–1875), when states regulated paupers, convicts, disease and free Black people under their police power.<\/li><li>Why so late: slavery. Southern states needed to control free Black people's movement and feared a strong federal power over entry could be turned against slavery (Parker, Kenny).<\/li><li>Steps: Passenger Cases (1849); Henderson and Chy Lung (1876) struck down state laws; Congress passed the Page Act (1875), the 1882 Immigration and Exclusion Acts, and the 1891 Act creating a federal bureaucracy; Ellis Island opened in 1892.<\/li><li>Chae Chan Ping (1889) grounded federal power in sovereignty (plenary power).<\/li><li>Significance: created the national gatekeeping state we now take for granted.<\/li><\/ul>","rubric":["Defined the term precisely","Placed it in time and named key people or institutions","Tied it to a specific reading and its author's argument","Explained its significance (what it changed, who gained or lost)","Connected it to at least one other keyword"]},{"id":"ID-police","mod":"ante","kind":"self","diff":2,"tag":"twin","stem":"<b>Identify:<\/b> police power<div class='hint'>On paper, in your own words: define · context · reading · significance · connection.<\/div>","model":"<span class='muted small'>Antebellum era to 1876 · Parker; Zolberg; Neuman<\/span><ul><li>Definition: states' inherent power to protect the health, safety, welfare and morals of their residents.<\/li><li>Before federalization, states used it to regulate migration: quarantine, bonds and head taxes for paupers, bans on convicts, limits on free Black people's entry.<\/li><li>Miln (1837) upheld New York's passenger-reporting law as a police-power measure, not a regulation of commerce.<\/li><li>Parker: Southern and some Northern states used the same power to exclude or police free Black residents, which made states fiercely protective of it.<\/li><li>Lost ground after the Civil War as courts assigned immigration to the national government (Chy Lung, Henderson, 1876).<\/li><li>Significance: the legal basis of the “lost century” of state immigration control.<\/li><\/ul>","rubric":["Defined the term precisely","Placed it in time and named key people or institutions","Tied it to a specific reading and its author's argument","Explained its significance (what it changed, who gained or lost)","Connected it to at least one other keyword"]},{"id":"ID-commerce","mod":"ante","kind":"self","diff":2,"tag":"twin","stem":"<b>Identify:<\/b> commerce clause<div class='hint'>On paper, in your own words: define · context · reading · significance · connection.<\/div>","model":"<span class='muted small'>Constitution 1787; key cases 1824–1884 · Parker; Kenny<\/span><ul><li>Article I, Section 8: Congress may “regulate Commerce with foreign Nations, and among the several States.”<\/li><li>Before 1875, the main constitutional hook for federal control of migration: carrying passengers counted as commerce.<\/li><li>Gibbons v. Ogden (1824) read “commerce” broadly to include navigation.<\/li><li>Miln (1837) still upheld a state law (police power); the Passenger Cases (1849) struck down state head taxes on passengers as burdens on foreign commerce.<\/li><li>The Head Money Cases (1884) upheld a federal head tax under this power; later, sovereignty replaced commerce as the justification (Chae Chan Ping).<\/li><li>Parker: the fight over commerce vs. police power was shadowed by slavery and states' control of free Black mobility.<\/li><\/ul>","rubric":["Defined the term precisely","Placed it in time and named key people or institutions","Tied it to a specific reading and its author's argument","Explained its significance (what it changed, who gained or lost)","Connected it to at least one other keyword"]},{"id":"ID-gibbons","mod":"ante","kind":"self","diff":2,"tag":"twin","stem":"<b>Identify:<\/b> Gibbons v. Ogden (1824)<div class='hint'>On paper, in your own words: define · context · reading · significance · connection.<\/div>","model":"<span class='muted small'>1824 · Parker; Zolberg<\/span><ul><li>Supreme Court (Chief Justice Marshall), 1824: struck down New York's steamboat monopoly; “commerce” includes navigation, and federal law governs interstate and foreign commerce.<\/li><li>Not an immigration case, but it became the key precedent for arguing that ships carrying passengers fall under federal commerce power.<\/li><li>Parker: Miln (1837) had to distinguish Gibbons in order to uphold New York's passenger law.<\/li><li>Shows that early federal immigration power was indirect, working through commerce.<\/li><li>Significance: a building block of federalization.<\/li><\/ul>","rubric":["Defined the term precisely","Placed it in time and named key people or institutions","Tied it to a specific reading and its author's argument","Explained its significance (what it changed, who gained or lost)","Connected it to at least one other keyword"]},{"id":"ID-miln","mod":"ante","kind":"self","diff":2,"tag":"twin","stem":"<b>Identify:<\/b> Mayor of the City of New York v. Miln (1837)<div class='hint'>On paper, in your own words: define · context · reading · significance · connection.<\/div>","model":"<span class='muted small'>1837 · Parker; Zolberg<\/span><ul><li>Supreme Court, 1837: upheld a New York law requiring ship masters to report each passenger's name, age, birthplace and occupation, to protect the city from people likely to need relief.<\/li><li>The Court's first ruling on the constitutionality of state immigration laws (Parker).<\/li><li>Reasoning: a valid exercise of the state's police power, not an interference with Congress's commerce power; the opinion compared paupers to a “moral pestilence.”<\/li><li>Effect: emboldened Massachusetts and New York to switch from bonds to per-passenger fees (Parker).<\/li><li>Context: the justices protected states' power to control their “internal foreigners,” including free Black people (Parker).<\/li><li>Later limited by the Passenger Cases (1849) and overtaken by federalization.<\/li><\/ul>","rubric":["Defined the term precisely","Placed it in time and named key people or institutions","Tied it to a specific reading and its author's argument","Explained its significance (what it changed, who gained or lost)","Connected it to at least one other keyword"]},{"id":"ID-domestic","mod":"ante","kind":"self","diff":2,"tag":"twin","stem":"<b>Identify:<\/b> “domestic foreignness”<div class='hint'>On paper, in your own words: define · context · reading · significance · connection.<\/div>","model":"<span class='muted small'>Antebellum era; echoes after 1898 · Parker, “Blacks, Indians, and Other Aliens”<\/span><ul><li>Definition: being inside the nation yet treated as foreign or outside full membership.<\/li><li>Parker: in antebellum America, free Black people, Native Americans and others (paupers; married women under coverture) were made into “internal foreigners.”<\/li><li>Free Black people faced entry bans and bonds in many states, even in the North, and Dred Scott (1857) denied them citizenship.<\/li><li>Native nations were called “domestic dependent nations” (Cherokee Nation v. Georgia, 1831), and Removal worked like deportation.<\/li><li>Later echoes: Chinese immigrants made permanent aliens; colonial subjects after 1898 (Puerto Rico, the Philippines) treated as non-citizen nationals, “foreign in a domestic sense.”<\/li><li>Significance: immigration law's tools (exclusion, removal, registration) were rehearsed on people already inside, so citizenship and foreignness came in grades.<\/li><\/ul>","rubric":["Defined the term precisely","Placed it in time and named key people or institutions","Tied it to a specific reading and its author's argument","Explained its significance (what it changed, who gained or lost)","Connected it to at least one other keyword"]},{"id":"ID-knownothing","mod":"ante","kind":"self","diff":2,"tag":"twin","stem":"<b>Identify:<\/b> Know-Nothings<div class='hint'>On paper, in your own words: define · context · reading · significance · connection.<\/div>","model":"<span class='muted small'>1850s; peak 1854–56 · Zolberg; “America for the Americans” (1855); Whitney (1856); Spalding (1855)<\/span><ul><li>Nativist movement and party of the 1850s (the American Party), grown from secret lodges; members told outsiders they “knew nothing.”<\/li><li>Target: mass Irish and German Catholic immigration after the Irish famine; fears of papal power, pauperism, crime and immigrant voting.<\/li><li>Program (Zolberg; Whitney's <i>Defence of the American Policy<\/i>; the “America for the Americans” editorial): a 21-year wait for naturalization, office for the native-born only, literacy tests and stricter voter registration.<\/li><li>Peak: swept Massachusetts in 1854; ran Millard Fillmore for president in 1856; collapsed over slavery.<\/li><li>Catholic answer: Bishop Martin Spalding's pastoral letter (1855), written after Louisville's “Bloody Monday” riot, defended immigrants' rights.<\/li><li>Significance: the first mass nativist party; it tied religion and foreignness to political danger, and its ideas returned in later restriction.<\/li><\/ul>","rubric":["Defined the term precisely","Placed it in time and named key people or institutions","Tied it to a specific reading and its author's argument","Explained its significance (what it changed, who gained or lost)","Connected it to at least one other keyword"]},{"id":"ID-contract","mod":"labor","kind":"self","diff":2,"tag":"twin","stem":"<b>Identify:<\/b> contract labor<div class='hint'>On paper, in your own words: define · context · reading · significance · connection.<\/div>","model":"<span class='muted small'>1864 Act; banned 1885 · Erickson; Kenny; Gabaccia<\/span><ul><li>Definition: recruiting workers abroad under contracts that bind them to work for a set term to repay their passage.<\/li><li>The 1864 Act to Encourage Immigration made such contracts enforceable. Erickson shows its sponsors wanted skilled, mostly British industrial workers, a revival of old indentured service.<\/li><li>Erickson: the popular link between contract labor and unskilled Asian and southern European workers was “not based on fact,” and organized importation was limited.<\/li><li>Kenny: in an antislavery age, contract labor stirred fears of unfree labor (“coolieism”) undercutting free white workers.<\/li><li>Banned by the Foran Act (1885), pushed by unions such as the Knights of Labor; padrones (labor brokers) kept similar practices going informally.<\/li><li>Significance: immigration policy as labor policy.<\/li><\/ul>","rubric":["Defined the term precisely","Placed it in time and named key people or institutions","Tied it to a specific reading and its author's argument","Explained its significance (what it changed, who gained or lost)","Connected it to at least one other keyword"]},{"id":"ID-coolie","mod":"labor","kind":"self","diff":2,"tag":"twin","stem":"<b>Identify:<\/b> “coolie”<div class='hint'>On paper, in your own words: define · context · reading · significance · connection.<\/div>","model":"<span class='muted small'>1840s–1880s · Kenny; Gabaccia; lecture<\/span><ul><li>Definition: a racializing, derogatory label for Asian laborers (Chinese and South Asian) transported under oppressive, debt-bound contracts.<\/li><li>Context: after slavery ended in the British Empire, a “coolie trade” shipped indentured workers to Cuba, Peru and the Caribbean under brutal conditions.<\/li><li>Republicans cast “coolieism” as a new form of slavery; Congress barred American ships from the coolie trade in 1862.<\/li><li>Kenny: this antislavery logic became the starting point of federal immigration policy (the anti-coolie law, the Page Act).<\/li><li>The label was stretched to all Chinese workers, picturing them as unfree and servile by race, which fed exclusion (1875, 1882).<\/li><li>Lecture: “coolie” tied race to unfree, cheap labor that threatened white “free labor” and manhood.<\/li><\/ul>","rubric":["Defined the term precisely","Placed it in time and named key people or institutions","Tied it to a specific reading and its author's argument","Explained its significance (what it changed, who gained or lost)","Connected it to at least one other keyword"]},{"id":"ID-burlingame","mod":"labor","kind":"self","diff":2,"tag":"twin","stem":"<b>Identify:<\/b> Burlingame Treaty (1868)<div class='hint'>On paper, in your own words: define · context · reading · significance · connection.<\/div>","model":"<span class='muted small'>1868; revised 1880 · Kenny; Zolberg; lecture<\/span><ul><li>Treaty between the U.S. and China (Burlingame–Seward Treaty, 1868), negotiated for China by Anson Burlingame, a former U.S. minister there.<\/li><li>Recognized the “inherent and inalienable right” to change home and allegiance and free voluntary migration both ways; condemned involuntary (coolie) emigration.<\/li><li>Gave Chinese residents the privileges of the most favored nation but expressly did not grant naturalization (Kenny).<\/li><li>Served U.S. trade and labor needs (railroad building), part of Secretary of State Seward's proactive immigration policy (Zolberg).<\/li><li>Lecture: a form of shared sovereignty, two states cooperating over migration.<\/li><li>Became an obstacle to exclusion; the Angell Treaty (1880) let the U.S. “suspend” Chinese labor migration, opening the way to 1882. Chae Chan Ping (1889) later held Congress could override such treaties.<\/li><\/ul>","rubric":["Defined the term precisely","Placed it in time and named key people or institutions","Tied it to a specific reading and its author's argument","Explained its significance (what it changed, who gained or lost)","Connected it to at least one other keyword"]},{"id":"ID-fourteenth","mod":"labor","kind":"self","diff":2,"tag":"twin","stem":"<b>Identify:<\/b> Fourteenth Amendment<div class='hint'>On paper, in your own words: define · context · reading · significance · connection.<\/div>","model":"<span class='muted small'>Ratified 1868 · Kenny; Núñez; Parker<\/span><ul><li>Ratified 1868, during Reconstruction: “All persons born or naturalized in the United States, and subject to the jurisdiction thereof, are citizens.”<\/li><li>Overturned Dred Scott and made birthright citizenship (jus soli) constitutional.<\/li><li>Equal protection and due process cover any “person,” including non-citizens (later Yick Wo v. Hopkins, 1886).<\/li><li>Kenny: part of the antislavery expansion of federal power that made a national immigration policy possible.<\/li><li>In the 1866 debates, some senators objected that it would make children of Chinese immigrants citizens (Núñez cites these debates).<\/li><li>Did not open naturalization to Asians: the 1870 Naturalization Act added people of African descent only. Wong Kim Ark (1898) confirmed its reach.<\/li><\/ul>","rubric":["Defined the term precisely","Placed it in time and named key people or institutions","Tied it to a specific reading and its author's argument","Explained its significance (what it changed, who gained or lost)","Connected it to at least one other keyword"]},{"id":"ID-birthright","mod":"labor","kind":"self","diff":2,"tag":"twin","stem":"<b>Identify:<\/b> birthright citizenship<div class='hint'>On paper, in your own words: define · context · reading · significance · connection.<\/div>","model":"<span class='muted small'>Common law; 1868; 1898 · Kenny; Núñez; course handout<\/span><ul><li>Definition: citizenship acquired automatically by birth within the territory (jus soli).<\/li><li>A common-law tradition, denied to Black Americans by Dred Scott (1857), then written into the Constitution by the Fourteenth Amendment (1868).<\/li><li>Wong Kim Ark (1898) extended it to children of Chinese immigrants who could not themselves naturalize.<\/li><li>Exceptions: children of diplomats and, until 1924, many Native Americans, ruled not “subject to the jurisdiction.”<\/li><li>Significance: lets immigrants' children become full members in one generation, breaking hereditary exclusion; repeatedly attacked (e.g., “anchor baby” rhetoric).<\/li><\/ul>","rubric":["Defined the term precisely","Placed it in time and named key people or institutions","Tied it to a specific reading and its author's argument","Explained its significance (what it changed, who gained or lost)","Connected it to at least one other keyword"]},{"id":"ID-foran","mod":"labor","kind":"self","diff":2,"tag":"twin","stem":"<b>Identify:<\/b> Foran Act (1885)<div class='hint'>On paper, in your own words: define · context · reading · significance · connection.<\/div>","model":"<span class='muted small'>February 1885 · Foran Act (primary); Erickson; Kenny<\/span><ul><li>Alien Contract Labor Law, February 1885, sponsored by Rep. Martin Foran of Ohio, a former union leader, and backed by the Knights of Labor.<\/li><li>Banned prepaying passage or otherwise importing aliens under contracts, made before arrival, to perform labor in the U.S.<\/li><li>Exempted skilled workers for new industries, domestic servants, professionals, artists and relatives.<\/li><li>Aimed at employers using imported workers (often Italians and Hungarians recruited through padrones) to cut wages or break strikes; it applied anti-coolie logic to Europeans.<\/li><li>Weakly enforced; amended in 1887–88 to allow deportation.<\/li><li>Significance: immigration policy as labor policy; federal power growing beyond Chinese exclusion.<\/li><\/ul>","rubric":["Defined the term precisely","Placed it in time and named key people or institutions","Tied it to a specific reading and its author's argument","Explained its significance (what it changed, who gained or lost)","Connected it to at least one other keyword"]},{"id":"ID-page","mod":"excl","kind":"self","diff":2,"tag":"twin","stem":"<b>Identify:<\/b> Page Act (1875)<div class='hint'>On paper, in your own words: define · context · reading · significance · connection.<\/div>","model":"<span class='muted small'>March 1875 · Page Act (primary); Kenny; lecture<\/span><ul><li>The first federal restrictive immigration law (1875), sponsored by Rep. Horace Page of California.<\/li><li>Barred Asian laborers brought without their consent (“coolies”), women brought for prostitution, and convicts; required U.S. consuls in Asian ports to screen emigrants (remote control).<\/li><li>In practice it targeted Chinese women, presumed to be prostitutes, blocking family formation and keeping Chinese communities mostly male.<\/li><li>Kenny: grew out of antislavery politics, treating coolie labor and prostitution as forms of slavery.<\/li><li>Same moment as Chy Lung (1876), which said such control belonged to the federal government.<\/li><li>Significance: race, gender and labor fused in the first federal exclusion.<\/li><\/ul>","rubric":["Defined the term precisely","Placed it in time and named key people or institutions","Tied it to a specific reading and its author's argument","Explained its significance (what it changed, who gained or lost)","Connected it to at least one other keyword"]},{"id":"ID-chylung","mod":"excl","kind":"self","diff":2,"tag":"twin","stem":"<b>Identify:<\/b> Chy Lung v. Freeman (1875)<div class='hint'>On paper, in your own words: define · context · reading · significance · connection.<\/div>","model":"<span class='muted small'>Argued 1875, decided 1876 · Lecture (Sep 23)<\/span><ul><li>Supreme Court (decided 1876): struck down a California law letting its immigration commissioner demand bonds for arriving passengers he judged “lewd and debauched” and other categories.<\/li><li>Facts: 22 Chinese women were detained in San Francisco in 1874 as presumed prostitutes; Chy Lung was one of them.<\/li><li>Reasoning: control over admitting foreigners belongs to the federal government, because one state's abuses could drag the whole nation into diplomatic conflict.<\/li><li>With Henderson v. Mayor of New York (1876), it ended most state immigration laws: a turning point in federalization.<\/li><li>Irony: it protected the women from California but cleared the way for federal exclusion (Page Act, 1882).<\/li><\/ul>","rubric":["Defined the term precisely","Placed it in time and named key people or institutions","Tied it to a specific reading and its author's argument","Explained its significance (what it changed, who gained or lost)","Connected it to at least one other keyword"]},{"id":"ID-exclusion","mod":"excl","kind":"self","diff":2,"tag":"twin","stem":"<b>Identify:<\/b> Chinese Exclusion Act (1882)<div class='hint'>On paper, in your own words: define · context · reading · significance · connection.<\/div>","model":"<span class='muted small'>May 1882; repealed 1943 · Lew-Williams; Hoar; Saum Song Bo; Wong Chin Foo; Gabaccia<\/span><ul><li>May 1882: suspended immigration of Chinese laborers for 10 years; exempted merchants, students, teachers, diplomats and travelers; required certificates; barred Chinese from naturalization.<\/li><li>The first federal law to exclude a group by race and nationality.<\/li><li>Context: the anti-Chinese movement in California (“The Chinese must go!”), labor competition, and racist images of Chinese as unfree “coolies” who could not assimilate.<\/li><li>Opposition: Sen. George Hoar called it a betrayal of the Declaration's principles; Saum Song Bo (1885) and Wong Chin Foo (1892) protested in print.<\/li><li>Lew-Williams: exclusion and the anti-Chinese violence of 1885–86 together made the Chinese “the alien.”<\/li><li>Extended by the Scott Act (1888) and Geary Act (1892), made permanent (1902/1904), repealed in 1943 when China was a wartime ally.<\/li><\/ul>","rubric":["Defined the term precisely","Placed it in time and named key people or institutions","Tied it to a specific reading and its author's argument","Explained its significance (what it changed, who gained or lost)","Connected it to at least one other keyword"]},{"id":"ID-lpc","mod":"excl","kind":"self","diff":2,"tag":"twin","stem":"<b>Identify:<\/b> “likely to become a public charge” (LPC)<div class='hint'>On paper, in your own words: define · context · reading · significance · connection.<\/div>","model":"<span class='muted small'>1882 / 1891; used in the 1930s · Zolberg; eugenics reading; lecture (Oct 6)<\/span><ul><li>Definition: a statutory filter excluding immigrants judged likely to need public support.<\/li><li>Roots in colonial and state poor laws (pauperism); the 1882 Immigration Act barred anyone “unable to take care of himself or herself without becoming a public charge”; the 1891 Act used “likely to become a public charge.”<\/li><li>Broad and discretionary: used against the poor, single women, the disabled and others judged dependent.<\/li><li>1930s: State Department consuls used LPC to deny visas to Jewish refugees from Nazi Germany (lecture).<\/li><li>Still in U.S. law: “public charge” rules remain part of today's debates.<\/li><li>Significance: class and dependency as constant lines of exclusion alongside race.<\/li><\/ul>","rubric":["Defined the term precisely","Placed it in time and named key people or institutions","Tied it to a specific reading and its author's argument","Explained its significance (what it changed, who gained or lost)","Connected it to at least one other keyword"]},{"id":"ID-chae","mod":"excl","kind":"self","diff":2,"tag":"twin","stem":"<b>Identify:<\/b> Chae Chan Ping v. United States (1889)<div class='hint'>On paper, in your own words: define · context · reading · significance · connection.<\/div>","model":"<span class='muted small'>1889 · Núñez; lecture<\/span><ul><li>“The Chinese Exclusion Case.” Chae Chan Ping, a laborer living in San Francisco since 1875, left for China in 1887 with a certificate guaranteeing his return.<\/li><li>While he was at sea, the Scott Act (1888) voided all such certificates, and he was refused re-entry.<\/li><li>The Supreme Court (Justice Field, unanimous) upheld his exclusion: the power to exclude foreigners is part of national sovereignty, held by the federal government, and Congress may override a treaty (Burlingame) by a later law.<\/li><li>The opinion described Chinese migration in invasion language (“vast hordes”), which Núñez highlights.<\/li><li>Significance: the origin of the plenary power doctrine.<\/li><\/ul>","rubric":["Defined the term precisely","Placed it in time and named key people or institutions","Tied it to a specific reading and its author's argument","Explained its significance (what it changed, who gained or lost)","Connected it to at least one other keyword"]},{"id":"ID-plenary","mod":"excl","kind":"self","diff":2,"tag":"twin","stem":"<b>Identify:<\/b> plenary power doctrine<div class='hint'>On paper, in your own words: define · context · reading · significance · connection.<\/div>","model":"<span class='muted small'>1889–1893 cases onward · Course handout; lecture<\/span><ul><li>Definition: the doctrine that Congress and the executive hold broad, nearly unreviewable power over immigration: admission, exclusion and deportation.<\/li><li>Grounded in sovereignty rather than an enumerated power in the Constitution.<\/li><li>Built in the Chinese exclusion cases: Chae Chan Ping (1889), Nishimura Ekiu (1892), and Fong Yue Ting (1893, on deportation).<\/li><li>Courts defer, so constitutional protections apply only weakly to non-citizens at the border.<\/li><li>Course definition: the state's absolute, unreviewable legal authority over border gatekeeping.<\/li><li>Significance: let racially discriminatory immigration laws stand that would be struck down anywhere else.<\/li><\/ul>","rubric":["Defined the term precisely","Placed it in time and named key people or institutions","Tied it to a specific reading and its author's argument","Explained its significance (what it changed, who gained or lost)","Connected it to at least one other keyword"]},{"id":"ID-wka","mod":"excl","kind":"self","diff":2,"tag":"twin","stem":"<b>Identify:<\/b> United States v. Wong Kim Ark (1898)<div class='hint'>On paper, in your own words: define · context · reading · significance · connection.<\/div>","model":"<span class='muted small'>1898 · Lecture; course handout<\/span><ul><li>Wong Kim Ark was born in San Francisco (1873) to Chinese parents who lived there but could not naturalize; returning from China in 1895, he was refused entry as a non-citizen.<\/li><li>Supreme Court (Justice Gray, 6–2): he was a citizen by birth under the Fourteenth Amendment; jus soli applies regardless of parents' race or eligibility to naturalize.<\/li><li>Limits: his parents stayed barred from citizenship, exclusion continued, and Chinese Americans still faced suspicion at the border.<\/li><li>Significance: the foundation of birthright citizenship for immigrants' children, invoked in today's debates.<\/li><\/ul>","rubric":["Defined the term precisely","Placed it in time and named key people or institutions","Tied it to a specific reading and its author's argument","Explained its significance (what it changed, who gained or lost)","Connected it to at least one other keyword"]},{"id":"ID-melting","mod":"newimm","kind":"self","diff":2,"tag":"twin","stem":"<b>Identify:<\/b> melting pot<div class='hint'>On paper, in your own words: define · context · reading · significance · connection.<\/div>","model":"<span class='muted small'>Zangwill's play, 1908 · Ross & Andrews (Opposing Viewpoints); Addams; lecture<\/span><ul><li>Definition: the metaphor of immigrants fusing into a new, unified American people; popularized by Israel Zangwill's play <i>The Melting Pot<\/i> (1908).<\/li><li>Course definition: celebrates America's capacity to completely assimilate immigrants into the dominant culture.<\/li><li>Lecture: breaks individual elements down into a whole seen as better; homogenization and assimilation.<\/li><li>Debate: A. Piatt Andrews trusted assimilation; E. A. Ross feared “inferior” stock would not melt.<\/li><li>Critique: in practice it meant conforming to Anglo-Protestant norms, and Asians, Black Americans and Native peoples were left out of the pot.<\/li><li>Alternative: pluralism, as in Addams' respect for immigrant cultures.<\/li><\/ul>","rubric":["Defined the term precisely","Placed it in time and named key people or institutions","Tied it to a specific reading and its author's argument","Explained its significance (what it changed, who gained or lost)","Connected it to at least one other keyword"]},{"id":"ID-americ","mod":"newimm","kind":"self","diff":2,"tag":"twin","stem":"<b>Identify:<\/b> Americanization<div class='hint'>On paper, in your own words: define · context · reading · significance · connection.<\/div>","model":"<span class='muted small'>1900s–1920s; coercive in WWI · Addams; Barrett & Roediger; Guglielmo; lecture<\/span><ul><li>Definition: early-20th-century campaigns to turn European immigrants into “Americans”: English, civics, hygiene, diet, dress and loyalty.<\/li><li>Course definition: efforts by white, Anglo-Protestant Americans to make immigrant cultures conform to U.S. norms.<\/li><li>Agents: settlement houses, schools, employers' English classes, churches; it turned coercive during WWI (“100% Americanism”).<\/li><li>Addams and lecture: it opened a gap between generations; children learned English fast and felt shame about their parents' ways.<\/li><li>Barrett & Roediger: Americanization also meant learning America's racial order “from the bottom up,” learning to be white.<\/li><li>Significance: assimilation as a condition of belonging.<\/li><\/ul>","rubric":["Defined the term precisely","Placed it in time and named key people or institutions","Tied it to a specific reading and its author's argument","Explained its significance (what it changed, who gained or lost)","Connected it to at least one other keyword"]},{"id":"ID-settlement","mod":"newimm","kind":"self","diff":2,"tag":"twin","stem":"<b>Identify:<\/b> settlement house movement<div class='hint'>On paper, in your own words: define · context · reading · significance · connection.<\/div>","model":"<span class='muted small'>1880s–1920s; Hull-House 1889 · Addams, <i>Twenty Years at Hull-House<\/i> (1910)<\/span><ul><li>Definition: a Progressive-era reform movement (1880s–1920s) in which middle-class, often college-educated women lived among immigrant workers and offered services.<\/li><li>Jane Addams and Ellen Gates Starr founded Hull-House in Chicago (1889): kindergartens, English classes, clubs, labor and housing research.<\/li><li>Addams, “Immigrants and Their Children”: the Labor Museum honored immigrant crafts to bridge the gap between parents and Americanized children.<\/li><li>Mixed: real concern for social justice and an early cultural pluralism, but hierarchical and Americanizing.<\/li><li>Addams later won the Nobel Peace Prize (1931).<\/li><li>Significance: a reform response to the new immigration that did not call for restriction.<\/li><\/ul>","rubric":["Defined the term precisely","Placed it in time and named key people or institutions","Tied it to a specific reading and its author's argument","Explained its significance (what it changed, who gained or lost)","Connected it to at least one other keyword"]},{"id":"ID-inbetween","mod":"newimm","kind":"self","diff":2,"tag":"twin","stem":"<b>Identify:<\/b> “in-between peoples”<div class='hint'>On paper, in your own words: define · context · reading · significance · connection.<\/div>","model":"<span class='muted small'>About 1895–1924 · Barrett & Roediger (1997)<\/span><ul><li>Barrett & Roediger (1
